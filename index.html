        body {
            font-family: 'Prompt', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Banking Card Gradient & Glassmorphism */
        .bank-card {
            background: linear-gradient(135deg, #8E3C77 0%, #5A234B 50%, #2D1026 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px -15px rgba(142, 60, 119, 0.5);
        }

        .bank-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.25) 0%, transparent 60%);
            pointer-events: none;
        }

        .glass-banking {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .dark .glass-banking {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Keypad press animation */
        .keypad-btn:active {
            transform: scale(0.92);
            background-color: rgba(142, 60, 119, 0.2);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Soft Pulse for Status Badge */
        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .pulse-live {
            animation: statusPulse 2s infinite ease-in-out;
        }
    </style>

        // Get or Create Unique Device ID for Browser
        function getOrCreateDeviceId() {
            let devId = localStorage.getItem('ldc14_device_id');
            if (!devId) {
                devId = 'dev_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
                localStorage.setItem('ldc14_device_id', devId);
            }
            return devId;
        }

        // Initialize Data & Session
        function initData() {
            state.deviceId = getOrCreateDeviceId();
            
            const savedUsers = localStorage.getItem('ldc14_users');
            const savedTrans = localStorage.getItem('ldc14_transactions');
            const savedUser = localStorage.getItem('ldc14_session');
            
            if (savedUsers) state.users = JSON.parse(savedUsers);
            if (savedTrans) state.transactions = JSON.parse(savedTrans);
            if (savedUser) state.currentUser = JSON.parse(savedUser);

            document.documentElement.className = state.theme;
            updateThemeIcon();
            render();
        }

        function saveData() {
            localStorage.setItem('ldc14_users', JSON.stringify(state.users));
            localStorage.setItem('ldc14_transactions', JSON.stringify(state.transactions));
            if (state.currentUser) {
                localStorage.setItem('ldc14_session', JSON.stringify(state.currentUser));
            } else {
                localStorage.removeItem('ldc14_session');
            }
        }

        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.className = state.theme;
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            if (state.theme === 'dark') {
                icon.className = 'fa-solid fa-sun text-brand-gold';
            } else {
                icon.className = 'fa-solid fa-moon text-brand-pink';
            }
        }

        function toggleLang() {
            state.lang = state.lang === 'th' ? 'en' : 'th';
            document.getElementById('langLabel').innerText = state.lang.toUpperCase();
            render();
        }

        function toggleBalanceVisibility() {
            state.hideBalance = !state.hideBalance;
            render();
        }

        const t = (key) => dict[state.lang][key] || key;

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastContent = document.getElementById('toastContent');
            const toastIcon = document.getElementById('toastIcon');
            const toastMsg = document.getElementById('toastMsg');

            toastMsg.innerText = msg;
            if (type === 'error') {
                toastContent.className = "px-5 py-3.5 rounded-2xl shadow-2xl backdrop-blur-md border text-xs md:text-sm font-semibold flex items-center gap-2.5 bg-rose-500/20 border-rose-500/30 text-rose-600 dark:text-rose-300";
                toastIcon.className = "fa-solid fa-circle-xmark text-base md:text-lg";
            } else {
                toastContent.className = "px-5 py-3.5 rounded-2xl shadow-2xl backdrop-blur-md border text-xs md:text-sm font-semibold flex items-center gap-2.5 bg-emerald-500/20 border-emerald-500/30 text-emerald-600 dark:text-emerald-300";
                toastIcon.className = "fa-solid fa-circle-check text-base md:text-lg";
            }

            toast.classList.remove('translate-x-full', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
            }, 3000);
        }

        /* --- Global Confirmation Modal --- */
        let confirmActionCallback = null;
        function showConfirmModal(title, msg, onConfirm, isDanger = true) {
            document.getElementById('confirmModalTitle').innerText = title;
            document.getElementById('confirmModalMsg').innerText = msg;
            
            const actionBtn = document.getElementById('confirmModalActionBtn');
            if (isDanger) {
                actionBtn.className = "flex-1 py-2.5 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-semibold text-xs shadow-md transition-all";
            } else {
                actionBtn.className = "flex-1 py-2.5 rounded-xl bg-gradient-to-r from-brand-pink to-brand-pinkLight text-white font-semibold text-xs shadow-md transition-all";
            }

            confirmActionCallback = onConfirm;
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.add('hidden');
            confirmActionCallback = null;
        }

        document.getElementById('confirmModalActionBtn').addEventListener('click', () => {
            if (confirmActionCallback) confirmActionCallback();
            closeConfirmModal();
        });

        let authMode = 'login';

        function setAuthMode(mode) {
            authMode = mode;
            state.enteredPin = '';
            render();
        }

        // Handle Bank Keypad Input
        function handleKeypadPress(num) {
            if (num === 'backspace') {
                state.enteredPin = state.enteredPin.slice(0, -1);
            } else if (state.enteredPin.length < 10) {
                state.enteredPin += num;
            }
            updatePinDots();
        }

        function updatePinDots() {
            const container = document.getElementById('pinDotsContainer');
            if (!container) return;

            let html = '';
            for (let i = 0; i < 10; i++) {
                const filled = i < state.enteredPin.length;
                html += `
                    <div class="w-6 sm:w-7 md:w-8 h-8 sm:h-9 md:h-10 rounded-lg md:rounded-xl border flex items-center justify-center font-bold text-xs sm:text-sm md:text-base transition-all ${
                        filled 
                        ? 'border-brand-pink bg-gradient-to-tr from-brand-pink to-brand-pinkLight text-white shadow-md shadow-brand-pink/20 scale-105' 
                        : 'border-slate-300 dark:border-slate-700 bg-slate-100/50 dark:bg-slate-800/50 text-transparent'
                    }">
                        ${filled ? state.enteredPin[i] : '•'}
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function triggerBiometrics() {
            if (state.users.length > 0) {
                const targetUser = state.users[0];
                if (targetUser.boundDeviceId && targetUser.boundDeviceId !== state.deviceId) {
                    showToast(t('deviceBoundError'), 'error');
                    return;
                }
                showToast("สแกน Touch ID / Face ID สำเร็จ!", "success");
                state.currentUser = targetUser;
                saveData();
                render();
            } else {
                showToast("ยังไม่มีผู้ใช้อยู่ในระบบ กรุณาลงทะเบียนก่อน", "error");
            }
        }

        function handleBankAuth(e) {
            e.preventDefault();
            const emailInput = document.getElementById('authEmail').value.trim().toLowerCase();
            const pinInput = state.enteredPin;

            if (!emailInput.endsWith('@bumail.net') && !emailInput.endsWith('@bu.ac.th')) {
                showToast(t('requireBUEmail'), 'error');
                return;
            }

            if (pinInput.length !== 10) {
                showToast(t('require10Digits'), 'error');
                return;
            }

            const existingUser = state.users.find(u => u.email === emailInput || u.studentId === pinInput);

            if (authMode === 'login') {
                if (!existingUser) {
                    showToast(t('userNotFound'), 'error');
                    return;
                }
                if (existingUser.studentId !== pinInput) {
                    showToast("เลขประจำตัว 10 หลักไม่ถูกต้อง", "error");
                    return;
                }

                if (existingUser.boundDeviceId && existingUser.boundDeviceId !== state.deviceId) {
                    showToast(t('deviceBoundError'), 'error');
                    return;
                }

                if (!existingUser.boundDeviceId) {
                    existingUser.boundDeviceId = state.deviceId;
                }

                state.currentUser = existingUser;
                saveData();
                showToast(t('success'));
                render();
            } else {
                if (existingUser) {
                    showToast(t('emailExists'), 'error');
                    return;
                }
                state.currentUser = {
                    uid: 'user_' + Date.now(),
                    email: emailInput,
                    studentId: pinInput,
                    boundDeviceId: state.deviceId,
                    isSetup: false
                };
                saveData();
                showToast(t('success'));
                render();
            }
        }

        function logout() {
            state.currentUser = null;
            state.activeTab = 'dashboard';
            state.enteredPin = '';
            saveData();
            showToast(t('success'));
            render();
        }

        function switchTab(tabId) {
            state.activeTab = tabId;
            render();
        }

        function updateNavState() {
            const logoutBtn = document.getElementById('logoutBtn');
            const bottomNav = document.getElementById('bottomNav');
            const navApprovals = document.getElementById('nav-approvals');
            const navAdmin = document.getElementById('nav-admin');

            if (!state.currentUser || !state.currentUser.isSetup) {
                bottomNav.classList.add('hidden');
                logoutBtn.classList.add('hidden');
                return;
            }

            bottomNav.classList.remove('hidden');
            logoutBtn.classList.remove('hidden');

            const isTreasurer = state.currentUser.role === 'treasurer';
            if (isTreasurer) {
                navApprovals.classList.remove('hidden');
                navApprovals.classList.add('flex');
                navAdmin.classList.remove('hidden');
                navAdmin.classList.add('flex');
            } else {
                navApprovals.classList.add('hidden');
                navApprovals.classList.remove('flex');
                navAdmin.classList.add('hidden');
                navAdmin.classList.remove('flex');
            }

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-gradient-to-r', 'from-brand-pink', 'to-brand-pinkLight', 'text-white', 'shadow-md');
                btn.classList.add('text-slate-400');
            });

            const activeBtn = document.getElementById(`nav-${state.activeTab}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-400');
                activeBtn.classList.add('bg-gradient-to-r', 'from-brand-pink', 'to-brand-pinkLight', 'text-white', 'shadow-md');
            }
        }

        // Proof Modal Viewer Logic
        let currentModalProof = null;
        function openProofModal(imgUrl, title, subtitle) {
            currentModalProof = imgUrl;
            document.getElementById('modalImg').src = imgUrl;
            document.getElementById('modalTitle').innerText = title || t('proofTitle');
            document.getElementById('modalSubtitle').innerText = subtitle || '';
            document.getElementById('proofModal').classList.remove('hidden');
        }

        function closeProofModal() {
            document.getElementById('proofModal').classList.add('hidden');
        }

        function downloadProof() {
            if (!currentModalProof) return;
            const link = document.createElement('a');
            link.href = currentModalProof;
            link.download = `ldc14-bank-slip-${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        /* --- Image Cropper Logic (1:1) --- */
        let cropper = null;
        let cropTargetPreviewId = null;

        function handleImageUpload(event, previewId, isProfile = false) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onloadend = () => {
                if (isProfile) {
                    cropTargetPreviewId = previewId;
                    openCropModal(reader.result);
                    event.target.value = '';
                } else {
                    uploadedImageTemp = reader.result;
                    const container = document.getElementById(previewId);
                    if (container) {
                        container.innerHTML = `
                            <img src="${reader.result}" class="w-16 h-16 rounded-xl object-cover shadow-sm mx-auto" />
                            <span class="text-[10px] text-emerald-500 font-semibold mt-1 block">อัปโหลดสลิปสำเร็จ</span>
                        `;
                    }
                }
            };
            reader.readAsDataURL(file);
        }

        function openCropModal(imageSrc) {
            const modalImg = document.getElementById('cropModalImg');
            modalImg.src = imageSrc;
            document.getElementById('cropModal').classList.remove('hidden');

            if (cropper) cropper.destroy();

            cropper = new Cropper(modalImg, {
                aspectRatio: 1,
                viewMode: 1,
                autoCropArea: 0.9,
                responsive: true
            });
        }

        function closeCropModal() {
            document.getElementById('cropModal').classList.add('hidden');
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        }

        function applyCropImage() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({ width: 350, height: 350 });
            uploadedImageTemp = canvas.toDataURL('image/jpeg', 0.9);
            const container = document.getElementById(cropTargetPreviewId);
            if (container) {
                container.innerHTML = `
                    <img src="${uploadedImageTemp}" class="w-16 h-16 rounded-full object-cover shadow-md mx-auto border-2 border-brand-pink" />
                    <span class="text-[10px] text-emerald-500 font-semibold mt-1 block">ครอปรูป 1:1 สำเร็จ</span>
                `;
            }
            closeCropModal();
        }

        function render() {
            const container = document.getElementById('mainContainer');
            updateNavState();

            if (!state.currentUser) {
                container.innerHTML = renderBankLoginScreen();
                updatePinDots();
                return;
            }

            if (!state.currentUser.isSetup) {
                container.innerHTML = renderOnboardingScreen();
                return;
            }

            switch (state.activeTab) {
                case 'dashboard':
                    container.innerHTML = renderDashboardView();
                    break;
                case 'expenses':
                    container.innerHTML = renderExpensesView();
                    break;
                case 'approvals':
                    container.innerHTML = renderApprovalsView();
                    break;
                case 'admin':
                    container.innerHTML = renderAdminView();
                    break;
                case 'profile':
                    container.innerHTML = renderProfileView();
                    break;
                default:
                    container.innerHTML = renderDashboardView();
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[state.lang][key]) el.innerText = dict[state.lang][key];
            });
        }

        let uploadedImageTemp = '';

        function saveProfileOnboarding(e) {
            e.preventDefault();
            const studentId = document.getElementById('onb_studentId').value;
            if (!/^\d{10}$/.test(studentId)) {
                showToast(t('require10Digits'), 'error');
                return;

            const newUser = {
                uid: state.currentUser.uid,
                email: state.currentUser.email,
                studentId: studentId,
                name: document.getElementById('onb_name').value,
                surname: document.getElementById('onb_surname').value,

                photoUrl: uploadedImageTemp || '',
                boundDeviceId: state.deviceId,
                role: isFirst ? 'treasurer' : 'member',
                isSetup: true
            };

            state.currentUser = newUser;
            state.users.push(newUser);
            uploadedImageTemp = '';
            saveData();
            showToast(t('success'));
            render();

                    saveData();
                    showToast(t('success'));
                    render();

            reader.readAsDataURL(file);

                                <div class="space-y-2 max-h-56 overflow-y-auto no-scrollbar">
                                    ${state.users.map(u => `
                                        <div class="flex items-center justify-between p-2.5 rounded-xl bg-white/40 dark:bg-white/5 border border-slate-200/40 dark:border-white/5">
                                            <div class="flex items-center gap-2.5">
                                                <div class="w-8 h-8 rounded-full bg-slate-200 overflow-hidden shrink-0 flex items-center justify-center">
                                                    ${u.photoUrl ? `<img src="${u.photoUrl}" class="w-full h-full object-cover"/>` : `<i class="fa-solid fa-user text-slate-400 text-xs"></i>`}
                                                </div>
                                                <div>
                                                    <p class="font-bold text-xs md:text-sm">${u.name} (${u.nickname})</p>
                                                    <p class="text-[10px] md:text-xs text-slate-400 font-mono">${u.studentId}</p>
                                                </div>
                                            </div>
                                            <span class="text-[10px] px-2.5 py-0.5 rounded-full font-bold uppercase ${
                                                u.role === 'treasurer' ? 'bg-amber-500/20 text-amber-500' : 'bg-slate-500/20 text-slate-400'
                                            }">
                                                ${t(u.role)}
                                            </span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Member Role Manager & Actions -->
                            <div class="space-y-2.5">
                                <h3 class="text-xs md:text-sm font-bold flex items-center gap-2">
                                    <i class="fa-solid fa-user-shield text-brand-pink"></i> ${t('manageRoles')}
                                </h3>
                                ${state.users.map(u => `
                                    <div class="glass-banking p-3.5 rounded-2xl flex items-center justify-between gap-3">
                                        <div class="flex items-center gap-2.5">
                                            <div class="w-9 h-9 rounded-full bg-slate-200 overflow-hidden shrink-0">
                                                ${u.photoUrl ? `<img src="${u.photoUrl}" class="w-full h-full object-cover"/>` : `<i class="fa-solid fa-user text-slate-400 p-2 text-sm"></i>`}
                                            </div>
                                            <div>
                                                <p class="font-bold text-xs md:text-sm">${u.name} (${u.nickname})</p>
                                                <p class="text-[10px] md:text-xs text-slate-400 font-mono flex items-center gap-1.5">
                                                    <span>${u.studentId}</span>
                                                    ${u.boundDeviceId ? `<span class="text-[9px] px-1.5 rounded bg-emerald-500/20 text-emerald-500 font-sans">ผูกเครื่องแล้ว</span>` : ''}
                                                </p>
                                            </div>
                                        </div>
                                        
                                        <div class="flex items-center gap-2">
                                            <select onchange="changeUserRole('${u.uid}', this.value)" class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-white/50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700">
                                                <option value="member" ${u.role === 'member' ? 'selected' : ''}>${t('member')}</option>
                                                <option value="treasurer" ${u.role === 'treasurer' ? 'selected' : ''}>${t('treasurer')}</option>
                                            </select>
                                            
                                            <!-- Device Reset Button -->
                                            <button onclick="resetMemberDeviceBinding('${u.uid}')" class="w-8 h-8 rounded-xl bg-amber-500/10 text-amber-500 hover:bg-amber-500/20 flex items-center justify-center transition-all" title="${t('resetDevice')}">
                                                <i class="fa-solid fa-mobile-retro text-xs"></i>
                                            </button>

                                            <!-- Delete Member Button -->
                                            <button onclick="confirmDeleteUser('${u.uid}')" class="w-8 h-8 rounded-xl bg-rose-500/10 text-rose-500 hover:bg-rose-500/20 flex items-center justify-center transition-all" title="${t('deleteUser')}">
                                                <i class="fa-solid fa-trash-can text-xs"></i>
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Right Admin Column (Span 5) -->
                        <div class="lg:col-span-5 space-y-5">
                            <!-- Refund Tool -->
                            <div class="glass-banking p-5 rounded-3xl space-y-3.5">
                                <h3 class="text-xs md:text-sm font-bold flex items-center gap-2">
                                    <i class="fa-solid fa-hand-holding-dollar text-brand-gold"></i> ${t('issueRefund')}
                                </h3>
                                <form onsubmit="submitRefund(event)" class="space-y-3">
                                    <div>
                                        <label class="text-xs font-semibold mb-1 block">${t('targetMember')}</label>
                                        <select id="ref_target" required class="w-full px-3.5 py-2.5 rounded-xl bg-white/50 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-700 text-xs md:text-sm">
                                            <option value="">-- เลือกสมาชิก --</option>
                                            ${state.users.map(u => `
                                                <option value="${u.uid}">${u.name} (${u.nickname}) - ${u.studentId}</option>
                                            `).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-xs font-semibold mb-1 block">${t('amount')}</label>
                                        <input type="number" id="ref_amount" required placeholder="0.00" class="w-full px-3.5 py-2.5 rounded-xl bg-white/50 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-700 text-xs md:text-sm">
                                    </div>
                                    <div>
                                        <label class="text-xs font-semibold mb-1 block">${t('refundSlipUrl')}</label>
                                        <input type="file" id="ref_slipFile" accept="image/*" required class="hidden" onchange="handleImageUpload(event, 'ref_slipPreview')">
                                        <label for="ref_slipFile" class="cursor-pointer block p-3.5 rounded-xl border-2 border-dashed border-slate-300 dark:border-white/20 hover:border-brand-pink transition-all text-center">
                                            <div id="ref_slipPreview" class="flex flex-col items-center gap-1">
                                                <i class="fa-solid fa-file-invoice text-slate-400 text-xl"></i>
                                                <span class="text-xs text-slate-400">${t('uploadImage')}</span>
                                            </div>
                                        </label>
                                    </div>
                                    <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-brand-gold to-brand-goldDark text-slate-900 font-bold text-xs md:text-sm shadow-md hover:opacity-90 transition-all">
                                        ${t('submit')}
                                    </button>
                                </form>
                            </div>

                            <!-- Factory Reset System Data Section -->
                            <div class="glass-banking p-5 rounded-3xl border border-rose-500/20 bg-rose-500/5 space-y-3">
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid fa-triangle-exclamation text-rose-500 text-base"></i>
                                    <h3 class="text-xs md:text-sm font-bold text-rose-500">อันตราย: การตั้งค่าระบบ</h3>
                                </div>
                                <p class="text-xs text-slate-400 leading-relaxed">
                                    ปุ่มนี้จะทำการรีเซ็ตระบบ ลบผู้ใช้งานทั้งหมด ประวัติธุรกรรม เซสชัน และการผูกเครื่องออกจากระบบใหม่ทั้งหมด
                                </p>
                                <button onclick="confirmResetSystem()" class="w-full py-3 rounded-xl bg-rose-500/90 hover:bg-rose-600 text-white font-bold text-xs md:text-sm shadow-md transition-all flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-rotate"></i>
                                    <span>${t('resetSystem')}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        /* --- Admin Action Functions --- */

        function confirmDeleteUser(uid) {
            const userToDelete = state.users.find(u => u.uid === uid);
            if (!userToDelete) return;

            showConfirmModal(
                `ยืนยันการลบสมาชิก`,
                `คุณต้องการลบคุณ ${userToDelete.name} (${userToDelete.nickname}) ออกจากระบบใช่หรือไม่?`,
                () => {
                    executeDeleteUser(uid);
                },
                true
            );
        }

        function executeDeleteUser(uid) {
            state.users = state.users.filter(u => u.uid !== uid);
            
            if (state.currentUser && state.currentUser.uid === uid) {
                state.currentUser = null;
                saveData();
                showToast("บัญชีของคุณถูกลบออกจากระบบแล้ว", "error");
                render();
                return;
            }

            saveData();
            showToast(t('success'));
            render();
        }

        function resetMemberDeviceBinding(uid) {
            const u = state.users.find(usr => usr.uid === uid);
            if (u) {
                u.boundDeviceId = null;
                saveData();
                showToast(`ปลดล็อกเครื่องให้ ${u.nickname} เรียบร้อยแล้ว`);
                render();
            }
        }

        function confirmResetSystem() {
            showConfirmModal(
                `รีเซ็ตระบบใหม่ทั้งหมด`,
                t('resetSystemConfirmMsg'),
                () => {
                    executeFactoryReset();
                },
                true
            );
        }

        function executeFactoryReset() {
            localStorage.removeItem('ldc14_users');
            localStorage.removeItem('ldc14_transactions');
            localStorage.removeItem('ldc14_session');
            localStorage.removeItem('ldc14_device_id');

            state.users = [];
            state.transactions = [];
            state.currentUser = null;
            state.enteredPin = '';
            state.deviceId = getOrCreateDeviceId();

            showToast("ล้างข้อมูลในระบบสำเร็จทั้งหมดแล้ว", "success");
            render();
        }

        function submitRefund(e) {
            e.preventDefault();
            const target = document.getElementById('ref_target').value;
            const amount = document.getElementById('ref_amount').value;

            if (!target || !amount || !uploadedImageTemp) {
                showToast("กรุณากรอกข้อมูลและอัปโหลดสลิปคืนเงินให้ครบถ้วน", "error");
                return;
            }

            const newTx = {
                id: 'tx_' + Date.now(),
                type: 'refund',
                amount: Number(amount),
                targetUser: target,
                slipUrl: uploadedImageTemp,
                status: 'approved',
                issuedBy: state.currentUser.uid,
                createdAt: new Date().toISOString()
            };

            state.transactions.unshift(newTx);
            uploadedImageTemp = '';
            saveData();
            showToast(t('success'));
            render();
        }

        function changeUserRole(uid, role) {
            const u = state.users.find(usr => usr.uid === uid);
            if (u) {
                u.role = role;
                if (state.currentUser.uid === uid) state.currentUser.role = role;
                saveData();
                showToast(t('success'));
                render();
            }
        }

        /* --- 6. Profile View (Responsive Card Grid) --- */
        let isEditingProfile = false;
        function renderProfileView() {
            const u = state.currentUser;
            const myTx = state.transactions.filter(t => t.requestedBy === u.uid || t.targetUser === u.uid);
            const myContrib = myTx.filter(t => t.type === 'deposit' && t.status === 'approved').reduce((acc, t) => acc + Number(t.amount), 0);
            const myRefunds = myTx.filter(t => t.type === 'refund' && t.status === 'approved').reduce((acc, t) => acc + Number(t.amount), 0);

            return `
                <div class="space-y-6 animate-in fade-in duration-200 max-w-4xl mx-auto">
                    <div class="glass-banking p-6 rounded-3xl relative overflow-hidden">
                        <div class="flex flex-col items-center text-center space-y-2.5">
                            <div class="w-24 h-24 rounded-full border-4 border-white dark:border-slate-800 shadow-xl overflow-hidden shrink-0 bg-slate-200">
                                ${u.photoUrl ? `<img src="${u.photoUrl}" class="w-full h-full object-cover" />` : `<i class="fa-solid fa-user text-3xl text-slate-400 mt-5"></i>`}
                            </div>
                            <div>
                                <h2 class="text-base md:text-xl font-bold">${u.name} ${u.surname} (${u.nickname})</h2>
                                <p class="text-xs text-slate-400 font-mono">${u.studentId} • ${u.email}</p>
                                <span class="inline-block mt-2 px-3 py-1 rounded-full bg-brand-pink/10 text-brand-pink dark:text-pink-300 text-xs font-bold uppercase">
                                    ${t(u.role)}
                                </span>
                            </div>
                            <button onclick="toggleEditProfile()" class="px-4 py-1.5 rounded-xl bg-slate-200/60 dark:bg-slate-800/60 text-xs font-bold flex items-center gap-1.5 hover:bg-slate-300 dark:hover:bg-slate-700 transition-all">
                                <i class="fa-solid fa-pen-to-square text-brand-pink"></i> ${isEditingProfile ? t('cancel') : t('editProfile')}
                            </button>
                        </div>

                        ${isEditingProfile ? `
                            <form onsubmit="saveProfileEdit(event)" class="mt-5 pt-5 border-t border-slate-200 dark:border-slate-800 space-y-3.5 max-w-md mx-auto">
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="text-xs font-semibold mb-1 block">${t('name')}</label>
                                        <input type="text" id="edit_name" value="${u.name}" required class="w-full px-3.5 py-2 rounded-xl bg-white/50 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-700 text-xs md:text-sm">
                                    </div>
                                    <div>
                                        <label class="text-xs font-semibold mb-1 block">${t('surname')}</label>
                                        <input type="text" id="edit_surname" value="${u.surname}" required class="w-full px-3.5 py-2 rounded-xl bg-white/50 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-700 text-xs md:text-sm">
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="text-xs font-semibold mb-1 block">${t('nickname')}</label>
                                        <input type="text" id="edit_nickname" value="${u.nickname}" required class="w-full px-3.5 py-2 rounded-xl bg-white/50 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-700 text-xs md:text-sm">
                                    </div>
                                    <div>
                                        <label class="text-xs font-semibold mb-1 block">${t('studentId')}</label>
                                        <input type="text" id="edit_studentId" pattern="\\d{10}" maxLength="10" value="${u.studentId}" readonly class="w-full px-3.5 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs md:text-sm font-mono">
                                    </div>
                                </div>
                                <div>
                                    <label class="text-xs font-semibold mb-1 block">${t('photoUrl')}</label>
                                    <input type="file" id="edit_photoFile" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'edit_photoPreview', true)">
                                    <label for="edit_photoFile" class="cursor-pointer block p-3 rounded-xl border-2 border-dashed border-slate-300 dark:border-white/20 text-center">
                                        <div id="edit_photoPreview" class="flex flex-col items-center gap-1">
                                            <i class="fa-solid fa-crop-simple text-slate-400 text-lg"></i>
                                            <span class="text-xs text-slate-400">${t('uploadImage')}</span>
                                        </div>
                                    </label>
                                </div>
                                <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-brand-pink to-brand-pinkLight text-white font-bold text-xs md:text-sm shadow-md">
                                    ${t('saveProfile')}
                                </button>
                            </form>
                        ` : ''}
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="glass-banking p-4 rounded-2xl text-center">
                            <p class="text-xs text-slate-400 mb-1">${t('contributions')}</p>
                            <h4 class="text-lg md:text-xl font-extrabold text-emerald-500 font-mono">฿${myContrib.toLocaleString()}</h4>
                        </div>
                        <div class="glass-banking p-4 rounded-2xl text-center">
                            <p class="text-xs text-slate-400 mb-1">${t('refunds')}</p>
                            <h4 class="text-lg md:text-xl font-extrabold text-brand-gold font-mono">฿${myRefunds.toLocaleString()}</h4>
                        </div>
                    </div>

                    <div class="space-y-2.5">
                        <h3 class="text-xs md:text-sm font-bold text-slate-500 uppercase tracking-wider">${t('history')}</h3>
                        ${myTx.length === 0 ? `<p class="text-slate-400 text-xs text-center py-6">ไม่มีประวัติการชำระเงิน</p>` : ''}
                        ${myTx.map(tx => {
                            const slip = tx.slipUrl || tx.proofUrl;
                            return `
                                <div class="glass-banking p-3.5 rounded-2xl flex items-center justify-between shadow-sm">
                                    <div class="flex items-center gap-3">
                                        <div class="w-9 h-9 rounded-xl shrink-0 flex items-center justify-center ${
                                            tx.type === 'deposit' ? 'bg-emerald-500/10 text-emerald-500' :
                                            tx.type === 'expense' ? 'bg-rose-500/10 text-rose-500' :
                                            'bg-amber-500/10 text-amber-500'
                                        }">
                                            <i class="fa-solid ${tx.type === 'deposit' ? 'fa-arrow-down' : 'fa-arrow-up'} text-sm"></i>
                                        </div>
                                        <div>
                                            <p class="font-bold text-xs md:text-sm">${t(tx.type)}</p>
                                            <div class="flex items-center gap-1.5 mt-0.5">
                                                <span class="text-[10px] md:text-xs text-slate-400">${t(tx.status)}</span>
                                                ${slip ? `
                                                    <button onclick="openProofModal('${slip}', '${t(tx.type)} - ฿${Number(tx.amount).toLocaleString()}', 'สถานะ: ${t(tx.status)}')" class="text-[9px] px-2 py-0.5 rounded-md bg-blue-500/10 text-blue-500 font-semibold flex items-center gap-1">
                                                        <i class="fa-solid fa-eye text-[9px]"></i> ${t('viewProof')}
                                                    </button>
                                                ` : ''}
                                            </div>
                                        </div>
                                    </div>
                                    <div class="font-bold text-xs md:text-sm font-mono ${tx.type === 'expense' ? 'text-rose-500' : 'text-emerald-500'}">
                                        ${tx.type === 'expense' ? '-' : '+'}฿${Number(tx.amount).toLocaleString()}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function toggleEditProfile() {
            isEditingProfile = !isEditingProfile;
            render();
        }

        function saveProfileEdit(e) {
            e.preventDefault();
            const studentId = document.getElementById('edit_studentId').value;
            if (!/^\d{10}$/.test(studentId)) {
                showToast(t('require10Digits'), 'error');
                return;
            }

            const u = state.currentUser;
            u.name = document.getElementById('edit_name').value;
            u.surname = document.getElementById('edit_surname').value;
            u.nickname = document.getElementById('edit_nickname').value;
            if (uploadedImageTemp) u.photoUrl = uploadedImageTemp;

            const idx = state.users.findIndex(usr => usr.uid === u.uid);
            if (idx !== -1) state.users[idx] = { ...u };

            uploadedImageTemp = '';
            isEditingProfile = false;
            saveData();
            showToast(t('success'));
            render();
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initData);
    </script>
</body>
</html>
