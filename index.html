        .ambient-orb {

        // Initialize App Data from LocalStorage (Simulation Database)
        function initData() {
            const savedUsers = localStorage.getItem('ldc14_users');
            const savedTrans = localStorage.getItem('ldc14_transactions');
            const savedUser = localStorage.getItem('ldc14_session');
            
            state.users = savedUsers ? JSON.parse(savedUsers) : initialMockUsers;
            state.transactions = savedTrans ? JSON.parse(savedTrans) : initialMockTransactions;
            state.currentUser = savedUser ? JSON.parse(savedUser) : initialMockUsers[0]; // Default to Demo Admin User for instant preview

            // Save back default mock if empty
            if (!savedUsers) saveData();

            // Apply Theme
            document.documentElement.className = state.theme;
            updateThemeIcon();
            render();
        }

        function saveData() {
            localStorage.setItem('ldc14_users', JSON.stringify(state.users));
            localStorage.setItem('ldc14_transactions', JSON.stringify(state.transactions));
            if (state.currentUser) {
                localStorage.setItem('ldc14_session', JSON.stringify(state.currentUser));
            } else {
                localStorage.removeItem('ldc14_session');
            }
        }

        // --- Theme & Language Toggles ---
        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.className = state.theme;
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            if (state.theme === 'dark') {
                icon.className = 'fa-solid fa-sun text-brand-gold';
            } else {
                icon.className = 'fa-solid fa-moon text-[#8E3C77]';
            }
        }

        function toggleLang() {
            state.lang = state.lang === 'th' ? 'en' : 'th';
            document.getElementById('langLabel').innerText = state.lang.toUpperCase();
            render();

            const toast = document.getElementById('toast');
            const toastContent = document.getElementById('toastContent');
            const toastIcon = document.getElementById('toastIcon');
            const toastMsg = document.getElementById('toastMsg');

            toastMsg.innerText = msg;
            if (type === 'error') {
                toastContent.className = "px-5 py-3 rounded-2xl shadow-2xl backdrop-blur-md border text-sm font-medium flex items-center gap-2 bg-rose-500/20 border-rose-500/30 text-rose-600 dark:text-rose-300";
                toastIcon.className = "fa-solid fa-circle-xmark";
            } else {
                toastContent.className = "px-5 py-3 rounded-2xl shadow-2xl backdrop-blur-md border text-sm font-medium flex items-center gap-2 bg-emerald-500/20 border-emerald-500/30 text-emerald-600 dark:text-emerald-300";
                toastIcon.className = "fa-solid fa-circle-check";
            }

            toast.classList.remove('translate-x-full', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
            }, 3000);
        }

        // --- Authentication Flow ---
        let authMode = 'login';

        function setAuthMode(mode) {
            authMode = mode;
            const tabLogin = document.getElementById('authTabLogin');
            const tabRegister = document.getElementById('authTabRegister');
            const submitBtnText = document.getElementById('authSubmitText');

            if (mode === 'login') {
                tabLogin.className = "flex-1 py-2 rounded-xl text-xs font-bold transition-all bg-gradient-to-r from-brand-pink to-brand-pinkLight text-white shadow-md";
                tabRegister.className = "flex-1 py-2 rounded-xl text-xs font-bold transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200";
                if (submitBtnText) submitBtnText.innerText = t('loginSubmitBtn');
            } else {
                tabRegister.className = "flex-1 py-2 rounded-xl text-xs font-bold transition-all bg-gradient-to-r from-brand-pink to-brand-pinkLight text-white shadow-md";
                tabLogin.className = "flex-1 py-2 rounded-xl text-xs font-bold transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200";
                if (submitBtnText) submitBtnText.innerText = t('registerSubmitBtn');
            }
        }

        function handleEmailAuth(e) {
            e.preventDefault();
            const emailInput = document.getElementById('authEmail').value.trim().toLowerCase();
            const passwordInput = document.getElementById('authPassword').value;

            if (!emailInput.endsWith('@bumail.net') && !emailInput.endsWith('@bu.ac.th')) {
                showToast(t('requireBUEmail'), 'error');
                return;
            }

            if (!passwordInput || passwordInput.length < 8) {
                showToast(t('invalidPassword'), 'error');
                return;
            }

            const existingUser = state.users.find(u => u.email === emailInput);

            if (authMode === 'login') {
                if (!existingUser) {
                    showToast(t('userNotFound'), 'error');
                    return;
                }
                if (existingUser.password !== passwordInput) {
                    showToast(t('wrongPassword'), 'error');
                    return;
                }
                state.currentUser = existingUser;
                saveData();
                showToast(t('success'));
                render();
            } else {
                if (existingUser) {
                    showToast(t('emailExists'), 'error');
                    return;
                }
                state.currentUser = {
                    uid: 'user_' + Date.now(),
                    email: emailInput,
                    password: passwordInput,
                    isSetup: false
                };
                saveData();
                showToast(t('success'));
                render();
            }
        }

        function logout() {
            state.currentUser = null;
            state.activeTab = 'dashboard';
            saveData();
            showToast(t('success'));
            render();
        }

        // --- Navigation ---
        function switchTab(tabId) {
            state.activeTab = tabId;
            render();
        }

        function updateNavState() {
            const bottomNav = document.getElementById('bottomNav');
            const logoutBtn = document.getElementById('logoutBtn');
            const navApprovals = document.getElementById('nav-approvals');
            const navAdmin = document.getElementById('nav-admin');

            if (!state.currentUser || !state.currentUser.isSetup) {
                bottomNav.classList.add('hidden');
                logoutBtn.classList.add('hidden');
                return;
            }

            bottomNav.classList.remove('hidden');
            logoutBtn.classList.remove('hidden');

            const isTreasurer = state.currentUser.role === 'treasurer';
            if (isTreasurer) {
                navApprovals.classList.remove('hidden');
                navApprovals.classList.add('flex');
                navAdmin.classList.remove('hidden');
                navAdmin.classList.add('flex');
            } else {
                navApprovals.classList.add('hidden');
                navApprovals.classList.remove('flex');
                navAdmin.classList.add('hidden');
                navAdmin.classList.remove('flex');
            }

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-gradient-to-r', 'from-brand-pink', 'to-brand-pinkLight', 'text-white', 'shadow-lg', 'scale-105');
                btn.classList.add('text-slate-500', 'dark:text-slate-400');
            });

            const activeBtn = document.getElementById(`nav-${state.activeTab}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-500', 'dark:text-slate-400');
                activeBtn.classList.add('bg-gradient-to-r', 'from-brand-pink', 'to-brand-pinkLight', 'text-white', 'shadow-lg', 'scale-105');
            }
        }

        // --- Proof Viewer Modal ---
        let currentModalProof = null;
        function openProofModal(imgUrl, title, subtitle) {
            currentModalProof = imgUrl;
            document.getElementById('modalImg').src = imgUrl;
            document.getElementById('modalTitle').innerText = title || t('proofTitle');
            document.getElementById('modalSubtitle').innerText = subtitle || '';
            document.getElementById('proofModal').classList.remove('hidden');
        }

        function closeProofModal() {
            document.getElementById('proofModal').classList.add('hidden');
        }

        function downloadProof() {
            if (!currentModalProof) return;
            const link = document.createElement('a');
            link.href = currentModalProof;
            link.download = `ldc14-proof-${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- Render Main Interface ---
        function render() {
            const container = document.getElementById('mainContainer');
            updateNavState();

            if (!state.currentUser) {
                container.innerHTML = renderLoginScreen();
                return;
            }

            if (!state.currentUser.isSetup) {
                container.innerHTML = renderOnboardingScreen();
                return;
            }

            switch (state.activeTab) {
                case 'dashboard':
                    container.innerHTML = renderDashboardView();
                    break;
                case 'expenses':
                    container.innerHTML = renderExpensesView();
                    break;
                case 'approvals':
                    container.innerHTML = renderApprovalsView();
                    break;
                case 'admin':
                    container.innerHTML = renderAdminView();
                    break;
                case 'profile':
                    container.innerHTML = renderProfileView();
                    break;
                default:
                    container.innerHTML = renderDashboardView();
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[state.lang][key]) el.innerText = dict[state.lang][key];
            });
        }

        let uploadedImageTemp = '';
        function handleImageUpload(event, previewId) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onloadend = () => {
                uploadedImageTemp = reader.result;
                const container = document.getElementById(previewId);
                if (container) {
                    container.innerHTML = `
                        <img src="${reader.result}" class="w-20 h-20 rounded-full object-cover shadow-md mx-auto" />
                        <span class="text-[10px] text-emerald-500 font-semibold">อัปโหลดเรียบร้อย</span>
                    `;
                }
            };
            reader.readAsDataURL(file);
        }

        function saveProfileOnboarding(e) {
            e.preventDefault();
            const studentId = document.getElementById('onb_studentId').value;
            if (!/^\d{10}$/.test(studentId)) {
                showToast(t('require10Digits'), 'error');
                return;
            }

            const isFirst = state.users.length === 0;
            const newUser = {
                uid: state.currentUser.uid,
                email: state.currentUser.email,
                password: state.currentUser.password,
                name: document.getElementById('onb_name').value,
                surname: document.getElementById('onb_surname').value,
                nickname: document.getElementById('onb_nickname').value,
                studentId: studentId,
                photoUrl: uploadedImageTemp || '',
                role: isFirst ? 'treasurer' : 'member',
                isSetup: true
            };

            state.currentUser = newUser;
            state.users.push(newUser);
            uploadedImageTemp = '';
            saveData();
            showToast(t('success'));
            render();
        }

                                                        ${reqUser ? reqUser.nickname : 'Unassigned'} • <span class="capitalize">${t(tx.status)}</span>

                        </div>

                </div>

        function toggleDepositModal() {
            const el = document.getElementById('depositFormDrawer');
            if (el) el.classList.toggle('hidden');
        }

        function submitDeposit(e) {
            e.preventDefault();
            const amount = document.getElementById('dep_amount').value;
            if (!amount || !uploadedImageTemp) {
                showToast("กรุณากรอกข้อมูลและอัปโหลดสลิปให้ครบถ้วน", "error");
                return;
            }

            const newTx = {
                id: 'tx_' + Date.now(),
                type: 'deposit',
                amount: Number(amount),
                slipUrl: uploadedImageTemp,
                status: 'pending',
                requestedBy: state.currentUser.uid,
                createdAt: new Date().toISOString()
            };

            state.transactions.unshift(newTx);
            uploadedImageTemp = '';
            saveData();
            showToast(t('success'));
            render();
        }

        // 4. Expenses View
        function renderExpensesView() {
            const expenses = state.transactions.filter(t => t.type === 'expense');
            return `
                <div class="space-y-6 animate-in fade-in duration-300">
                    <div class="flex justify-between items-center">

        function toggleExpenseDrawer() {

        function submitExpenseClaim(e) {
            e.preventDefault();
            const reason = document.getElementById('exp_reason').value;
            const amount = document.getElementById('exp_amount').value;

            const newTx = {
                id: 'tx_' + Date.now(),
                type: 'expense',
                amount: Number(amount),
                description: reason,
                status: 'pending',
                requestedBy: state.currentUser.uid,
                createdAt: new Date().toISOString()
            };

            state.transactions.unshift(newTx);
            saveData();
            showToast(t('success'));
            render();
        }

        function uploadExpenseProof(event, txId) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onloadend = () => {
                const tx = state.transactions.find(t => t.id === txId);
                if (tx) {
                    tx.proofUrl = reader.result;
                    saveData();
                    showToast(t('success'));
                    render();
                }
            };
            reader.readAsDataURL(file);
        }

            const newTx = {

                type: 'refund',
                amount: Number(amount),
                targetUser: target,
                slipUrl: uploadedImageTemp,
                status: 'approved',
                issuedBy: state.currentUser.uid,
                createdAt: new Date().toISOString()

            state.transactions.unshift(newTx);
            uploadedImageTemp = '';
            saveData();
            showToast(t('success'));
            render();

                                                <span class="text-[10px] text-slate-500 capitalize">${t(tx.status)}</span>
                                                ${slip ? `
                                                    <button onclick="openProofModal('${slip}', '${t(tx.type)} - ฿${Number(tx.amount).toLocaleString()}', 'สถานะ: ${t(tx.status)}')" class="text-[9px] px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-600 dark:text-blue-400 font-medium flex items-center gap-1">
                                                        <i class="fa-solid fa-eye text-[9px]"></i> ${t('viewProof')}
                                                    </button>
                                                ` : ''}
                                            </div>
                                        </div>
                                    </div>
                                    <div class="font-bold text-xs ${tx.type === 'expense' ? 'text-rose-500' : 'text-emerald-500'}">
                                        ${tx.type === 'expense' ? '-' : '+'}฿${Number(tx.amount).toLocaleString()}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function toggleEditProfile() {
            isEditingProfile = !isEditingProfile;
            render();
        }

        function saveProfileEdit(e) {
            e.preventDefault();
            const studentId = document.getElementById('edit_studentId').value;
            if (!/^\d{10}$/.test(studentId)) {
                showToast(t('require10Digits'), 'error');
                return;
            }

            const u = state.currentUser;
            u.name = document.getElementById('edit_name').value;
            u.surname = document.getElementById('edit_surname').value;
            u.nickname = document.getElementById('edit_nickname').value;
            u.studentId = studentId;
            if (uploadedImageTemp) u.photoUrl = uploadedImageTemp;

            const idx = state.users.findIndex(usr => usr.uid === u.uid);
            if (idx !== -1) state.users[idx] = { ...u };

            uploadedImageTemp = '';
            isEditingProfile = false;
            saveData();
            showToast(t('success'));
            render();
        }

        // Start Application
        window.addEventListener('DOMContentLoaded', initData);
    </script>
</body>
</html>
