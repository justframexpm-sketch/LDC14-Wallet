        function toggleLang() {

        async function initData() {
            document.getElementById('langLabel').innerText = state.lang.toUpperCase();
            const savedSession = localStorage.getItem('ldc14_minimal_session');
            if (savedSession) state.currentUser = JSON.parse(savedSession);
            
            applyTheme();
            await fetchCloudData();
            
            supabaseClient
                .channel('public:db')
                .on('postgres_changes', { event: '*', schema: 'public' }, fetchCloudData)
                .subscribe();
        }

        async function fetchCloudData() {
            try {
                const { data: usersData } = await supabaseClient.from('users').select('*');
                if (usersData) {
                    state.users = usersData.map(u => ({
                        uid: u.uid, email: u.email, studentId: u.student_id, name: u.name,
                        surname: u.surname, nickname: u.nickname, photoUrl: u.photo_url, 
                        role: u.role, isSetup: u.is_setup
                    }));
                }

                const { data: txData } = await supabaseClient.from('transactions').select('*').order('created_at', { ascending: false });
                if (txData) {
                    state.transactions = txData.map(t => ({
                        id: t.id, type: t.type, amount: t.amount, description: t.description,
                        slipUrl: t.slip_url, proofUrl: t.proof_url, status: t.status,
                        requestedBy: t.requested_by, targetUser: t.target_user
                    }));
                }

                if (state.currentUser) {
                    const match = state.users.find(u => u.uid === state.currentUser.uid);
                    if (match) state.currentUser = match;
                }
                
                if (!state.currentUser || state.currentUser.isSetup) {
                    render();
                }
            } catch (err) { 
                console.error(err); 
                if (!state.currentUser || state.currentUser.isSetup) render(); 
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            
            if (isError) {
                document.getElementById('toastContent').classList.add('bg-red-50', 'text-red-600', 'border-red-100');
                document.getElementById('toastContent').classList.remove('bg-slate-800', 'text-white', 'border-slate-700');
                document.getElementById('toastIcon').className = 'ph ph-x-circle text-xl text-red-500';
            } else {
                document.getElementById('toastContent').classList.remove('bg-red-50', 'text-red-600', 'border-red-100');
                document.getElementById('toastContent').classList.add('bg-slate-800', 'text-white', 'border-slate-700');
                document.getElementById('toastIcon').className = 'ph ph-check-circle text-xl text-brand-pinkLight';
            }
            
            toast.classList.remove('-translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-24', 'opacity-0');
            }, 3000);
        }

        function toggleTheme() {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            applyTheme();
        }
        
        function applyTheme() {
            if (state.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'ph ph-sun text-lg';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = 'ph ph-moon text-lg';
            }
        }

        let authMode = 'login';
        function setAuthMode(mode) { authMode = mode; state.enteredPin = ''; render(); }
        
        function handleKeypadPress(num) {
            if (num === 'del') state.enteredPin = state.enteredPin.slice(0, -1);
            else if (state.enteredPin.length < 10) state.enteredPin += num;
            renderPinDots();
        }

        function renderPinDots() {
            const container = document.getElementById('pinDots');
            if(!container) return;
            let html = '';
            for (let i = 0; i < 10; i++) {
                const filled = i < state.enteredPin.length;
                html += `<div class="w-3 h-3 rounded-full mx-1 transition-all ${filled ? 'bg-brand-pink scale-110' : 'bg-slate-200 dark:bg-slate-700'}"></div>`;
            }
            container.innerHTML = html;
        }

        function submitAuth(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim().toLowerCase();
            const pin = state.enteredPin;
            if (pin.length !== 10) return showToast(state.lang === 'th' ? 'กรุณากรอกรหัส 10 หลัก' : 'Please enter 10 digits', true);

            if (authMode === 'login') {
                const user = state.users.find(u => u.email === email && u.studentId === pin);
                if (!user) return showToast(state.lang === 'th' ? 'อีเมลหรือรหัส 10 หลักไม่ถูกต้อง' : 'Invalid email or 10-digit ID', true);
                
                state.currentUser = user;
                localStorage.setItem('ldc14_minimal_session', JSON.stringify(user));
                showToast(state.lang === 'th' ? 'เข้าสู่ระบบสำเร็จ' : 'Logged in successfully');
                render();
            } else {
                const domain = email.split('@')[1];
                if (domain !== 'bu.ac.th' && domain !== 'bumail.net') {
                    return showToast(state.lang === 'th' ? 'ใช้อีเมล @bu.ac.th หรือ @bumail.net เท่านั้น' : 'Use @bu.ac.th or @bumail.net only', true);
                }
                
                const existingByEmail = state.users.find(u => u.email === email);
                if (existingByEmail) return showToast(state.lang === 'th' ? 'อีเมลนี้ลงทะเบียนแล้ว' : 'Email already registered', true);
                
                const existingByPin = state.users.filter(u => u.studentId === pin);
                if (existingByPin.length >= 2) return showToast(state.lang === 'th' ? 'รหัสนักศึกษานี้ลงทะเบียนครบ 2 บัญชีแล้ว' : 'Student ID reached 2 accounts limit', true);
                
                const sameDomain = existingByPin.find(u => u.email.endsWith('@' + domain));
                if (sameDomain) return showToast(state.lang === 'th' ? `โดเมน @${domain} ถูกใช้สำหรับรหัสนี้ไปแล้ว` : `Domain @${domain} already registered for this ID`, true);

                state.currentUser = { uid: 'user_' + Date.now(), email, studentId: pin, isSetup: false };
                render();
            }
        }

        async function saveOnboarding(e) {
            e.preventDefault();
            const name = document.getElementById('ob_name').value;
            const nickname = document.getElementById('ob_nickname').value;
            const submitBtn = document.getElementById('ob_submit_btn');
            
            submitBtn.innerHTML = `<i class="ph ph-spinner-gap animate-spin text-xl"></i> ${state.lang === 'th' ? 'กำลังบันทึก...' : 'Saving...'}`;
            submitBtn.disabled = true;
            
            const newUser = {
                uid: state.currentUser.uid,
                email: state.currentUser.email,
                student_id: state.currentUser.studentId,
                name: name,
                surname: 'ไม่ระบุ',
                nickname: nickname,
                photo_url: uploadedImageTemp || '',
                role: state.users.length === 0 ? 'treasurer' : 'member',
                is_setup: true
            };

            const { error } = await supabaseClient.from('users').insert([newUser]);
            
            if (error) {
                submitBtn.innerHTML = t('saveData');
                submitBtn.disabled = false;
                return showToast('Error: ' + error.message, true);
            }

            state.currentUser = {
                uid: newUser.uid,
                email: newUser.email,
                studentId: newUser.student_id,
                name: newUser.name,
                surname: newUser.surname,
                nickname: newUser.nickname,
                photoUrl: newUser.photo_url,
                role: newUser.role,
                isSetup: true
            };
            
            state.users.push(state.currentUser);
            localStorage.setItem('ldc14_minimal_session', JSON.stringify(state.currentUser));
            
            uploadedImageTemp = '';
            state.activeTab = 'dashboard';
            
            render();
            showToast(state.lang === 'th' ? 'สร้างโปรไฟล์สำเร็จ' : 'Profile created');
            fetchCloudData(); 
        }

        function logout() {
            state.currentUser = null; state.enteredPin = '';
            localStorage.removeItem('ldc14_minimal_session');
            render();
        }

        function switchTab(tab) { state.activeTab = tab; render(); }

        let uploadedImageTemp = '';
        function handleImageUpload(event, previewId) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onloadend = () => {
                uploadedImageTemp = reader.result;
                const el = document.getElementById(previewId);
                if(el) el.innerHTML = `<img src="${reader.result}" class="w-full h-full object-cover rounded-xl" />`;
            };
            reader.readAsDataURL(file);
        }

        function closeConfirmModal() { 
            document.getElementById('confirmModal').classList.add('hidden'); 
        }
        
        function closeProofModal() { 
            document.getElementById('proofModal').classList.add('hidden'); 
        }
        
        let currentProofUrl = '';
        function openProofModal(url, title, subtitle) {
            currentProofUrl = url;
            document.getElementById('modalImg').src = url;
            document.getElementById('modalTitle').innerText = title || (state.lang === 'th' ? 'หลักฐาน' : 'Proof');
            document.getElementById('modalSubtitle').innerText = subtitle || '';
            document.getElementById('proofModal').classList.remove('hidden');
        }

        function render() {
            const container = document.getElementById('mainContainer');
            const nav = document.getElementById('bottomNav');
            const logoutBtn = document.getElementById('logoutBtn');

            // Update static i18n text
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (key) el.innerText = t(key);
            });

            if (!state.currentUser) {
                nav.classList.add('hidden'); logoutBtn.classList.add('hidden');
                container.innerHTML = renderAuth();
                renderPinDots();
                return;
            }

            if (!state.currentUser.isSetup) {
                nav.classList.add('hidden'); logoutBtn.classList.add('hidden');
                container.innerHTML = renderOnboarding();
                return;
            }

            nav.classList.remove('hidden'); logoutBtn.classList.remove('hidden');
            
            document.querySelectorAll('#bottomNav button').forEach(b => {
                b.classList.remove('nav-active');
                b.querySelector('i').classList.remove('weight-fill');
            });
            const activeBtn = document.getElementById(`nav-${state.activeTab}`);
            if(activeBtn) {
                activeBtn.classList.add('nav-active');
                activeBtn.querySelector('i').classList.add('weight-fill');
            }

            if (state.currentUser.role === 'treasurer') {
                document.getElementById('nav-approvals').classList.remove('hidden');
                document.getElementById('nav-approvals').classList.add('flex');
                document.getElementById('nav-admin').classList.remove('hidden');
                document.getElementById('nav-admin').classList.add('flex');
                
                const pending = state.transactions.filter(t => t.status === 'pending').length;
                const badge = document.getElementById('nav-badge');
                if(pending > 0) badge.classList.remove('hidden'); else badge.classList.add('hidden');
            } else {
                document.getElementById('nav-approvals').classList.add('hidden');
                document.getElementById('nav-approvals').classList.remove('flex');
                document.getElementById('nav-admin').classList.add('hidden');
                document.getElementById('nav-admin').classList.remove('flex');
            }

            switch(state.activeTab) {
                case 'dashboard': container.innerHTML = renderDashboard(); break;
                case 'expenses': container.innerHTML = renderExpenses(); break;
                case 'approvals': container.innerHTML = renderApprovals(); break;
                case 'admin': container.innerHTML = renderAdmin(); break;
                case 'profile': container.innerHTML = renderProfile(); break;
            }
        }

        async function submitDeposit(e) {
            e.preventDefault();
            const amt = document.getElementById('dep_amt').value;
            if(!amt || !uploadedImageTemp) return showToast(state.lang === 'th' ? 'กรุณากรอกข้อมูลและแนบรูปสลิปให้ครบถ้วน' : 'Please fill all details and slip', true);
            
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerHTML = '<i class="ph ph-spinner-gap animate-spin"></i> Loading...';
            btn.disabled = true;

            const { error } = await supabaseClient.from('transactions').insert([{ 
                id: 'tx_'+Date.now(), 
                type: 'deposit', 
                amount: amt, 
                slip_url: uploadedImageTemp, 
                status: 'pending', 
                requested_by: state.currentUser.uid 
            }]);
            
            btn.innerHTML = originalText;
            btn.disabled = false;

            if(error) return showToast(error.message, true);
            
            document.getElementById('actionModal').classList.add('hidden');
            uploadedImageTemp = ''; 
            showToast(state.lang === 'th' ? 'ส่งรายการสำเร็จ รอการตรวจสอบ' : 'Submitted successfully');
        }

        async function submitTreasurerRefund(e) {

                return showToast(state.lang === 'th' ? 'กรุณากรอกข้อมูลให้ครบถ้วน' : 'Please fill all fields', true);
            }

            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerHTML = '<i class="ph ph-spinner-gap animate-spin"></i> Loading...';
            btn.disabled = true;

            const { error } = await supabaseClient.from('transactions').insert([{ 
                id: 'tx_'+Date.now(), 
                type: 'refund', 
                amount: amt,
                description: reason,
                status: 'approved',
                requested_by: state.currentUser.uid,

        async function saveProfileEdit(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            
            const newStudentId = document.getElementById('edit_studentId').value.trim();
            if (!/^\d{10}$/.test(newStudentId)) {
                return showToast(state.lang === 'th' ? 'กรุณากรอกรหัสนักศึกษา 10 หลัก' : '10 digits required', true);
            }

            btn.innerHTML = '<i class="ph ph-spinner-gap animate-spin"></i> Loading...';
            btn.disabled = true;

            const updatePayload = {
                name: document.getElementById('edit_name').value,
                nickname: document.getElementById('edit_nickname').value,
                surname: document.getElementById('edit_surname').value || 'ไม่ระบุ',
                student_id: newStudentId
            };
            if (uploadedImageTemp) updatePayload.photo_url = uploadedImageTemp;

            const { error } = await supabaseClient.from('users').update(updatePayload).eq('uid', state.currentUser.uid);
            
            btn.innerHTML = t('save');
            btn.disabled = false;
            
            if (error) return showToast("Update error: " + error.message, true);

            uploadedImageTemp = '';
            isEditingProfile = false;
            
            state.currentUser.name = updatePayload.name;
            state.currentUser.nickname = updatePayload.nickname;
            state.currentUser.surname = updatePayload.surname;
            state.currentUser.studentId = updatePayload.student_id;
            if (updatePayload.photo_url) state.currentUser.photoUrl = updatePayload.photo_url;
            
            localStorage.setItem('ldc14_minimal_session', JSON.stringify(state.currentUser));
            showToast(state.lang === 'th' ? 'บันทึกโปรไฟล์สำเร็จ' : 'Profile saved');
            render();
        }
        
        async function toggleNotif(key) {

        function uploadExpenseProof(event, txId) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onloadend = async () => {
                const { error } = await supabaseClient.from('transactions').update({ proof_url: reader.result }).eq('id', txId);
                if (error) showToast("Upload failed", true);
                else showToast(state.lang === 'th' ? 'อัปโหลดใบเสร็จสำเร็จ' : 'Receipt uploaded');
            };
            reader.readAsDataURL(file);
        }

                                            <i class="ph ph-x text-lg"></i>
                                        </button>
                                        <button onclick="updateTxStatus('${tx.id}', 'approved')" class="w-10 h-10 rounded-full bg-green-50 text-green-500 flex items-center justify-center hover:bg-green-100 transition-colors shadow-sm">
                                            <i class="ph ph-check text-lg"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderAdmin() {
            return `
                <div class="space-y-4 pb-20 max-w-2xl mx-auto">
                    <div class="flex justify-between items-center px-1 mb-2">
                        <h2 class="font-bold text-xl text-slate-800 dark:text-white">${t('manageMembers')}</h2>
                        <span class="px-3 py-1 bg-brand-pinkLight/30 text-brand-pinkDark rounded-full text-xs font-bold">${state.users.length}</span>
                    </div>

                    <div class="space-y-3">
                        ${state.users.map(u => `
                            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl flex flex-col gap-3 shadow-card border border-slate-50 dark:border-slate-700/50">
                                <div class="flex justify-between items-center">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-full bg-slate-200 overflow-hidden shadow-sm flex items-center justify-center shrink-0">
                                            ${u.photoUrl ? `<img src="${u.photoUrl}" class="w-full h-full object-cover">` : `<i class="ph ph-user text-xl text-slate-400"></i>`}
                                        </div>
                                        <div>
                                            <p class="font-semibold text-sm">${u.name} (${u.nickname})</p>
                                            <p class="text-[10px] text-slate-400 font-mono">${u.studentId}</p>
                                        </div>
                                    </div>
                                    <button onclick="confirmDeleteUser('${u.uid}')" class="w-8 h-8 rounded-full bg-red-50 text-red-500 dark:bg-red-500/10 flex items-center justify-center hover:bg-red-100 transition-colors">
                                        <i class="ph ph-trash text-lg"></i>
                                    </button>
                                </div>
                                <div class="border-t border-slate-100 dark:border-slate-700/50 pt-3 flex items-center justify-between">
                                    <span class="text-xs text-slate-500 font-medium">${t('userRole')}</span>
                                    <select onchange="changeUserRole('${u.uid}', this.value)" class="text-xs px-3 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 outline-none text-slate-700 dark:text-slate-300 font-medium cursor-pointer">
                                        <option value="member" ${u.role === 'member' ? 'selected' : ''}>${t('memberRole')}</option>
                                        <option value="treasurer" ${u.role === 'treasurer' ? 'selected' : ''}>${t('treasurerRole')}</option>
                                    </select>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        function renderProfile() {
            if(!state.prefs) state.prefs = { notifyTransactions: true, notifyRequests: true };
            const isEditing = isEditingProfile;
            
            const myHist = state.transactions.filter(t => (t.requestedBy === state.currentUser.uid || t.targetUser === state.currentUser.uid) && (t.type === 'deposit' || t.type === 'refund'));
            
            return `
                <div class="pt-6 flex flex-col items-center pb-20 max-w-xl mx-auto">
                    <div class="w-24 h-24 rounded-full bg-slate-200 overflow-hidden mb-4 shadow-md flex items-center justify-center relative">
                        ${state.currentUser.photoUrl ? `<img src="${state.currentUser.photoUrl}" class="w-full h-full object-cover">` : `<i class="ph ph-user text-3xl text-slate-400"></i>`}
                    </div>
                    
                    ${!isEditing ? `
                        <h2 class="font-bold text-xl">${state.currentUser.name} (${state.currentUser.nickname})</h2>
                        <p class="text-slate-400 text-sm font-mono mt-1">${state.currentUser.studentId}</p>
                        <span class="mt-3 px-4 py-1.5 rounded-full bg-brand-pinkLight/30 text-brand-pinkDark text-xs font-bold uppercase tracking-wider">${state.currentUser.role === 'treasurer' ? t('treasurerRole') : t('memberRole')}</span>
                        
                        <div class="w-full mt-8 space-y-3 px-2">
                            <button onclick="toggleEditProfile()" class="w-full bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-card flex items-center justify-between text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors border border-slate-50 dark:border-slate-700/50">
                                <div class="flex items-center gap-3"><i class="ph ph-pencil-simple text-xl text-brand-pink"></i> ${t('editProfile')}</div>
                                <i class="ph ph-caret-right text-slate-300"></i>
                            </button>
                            
                            <div class="w-full bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-card flex flex-col gap-5 border border-slate-50 dark:border-slate-700/50">
                                <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${t('systemNotif')}</h3>
                                <div class="flex items-center justify-between">
                                    <span class="text-sm font-medium flex items-center gap-2 text-slate-700 dark:text-slate-200"><i class="ph ph-bell text-lg text-slate-400"></i> ${t('notifTx')}</span>
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" ${state.prefs.notifyTransactions ? 'checked' : ''} onchange="toggleNotif('notifyTransactions')" class="sr-only peer">
                                        <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-brand-pink"></div>
                                    </label>
                                </div>
                                ${state.currentUser.role === 'treasurer' ? `
                                <div class="flex items-center justify-between">
                                    <span class="text-sm font-medium flex items-center gap-2 text-slate-700 dark:text-slate-200"><i class="ph ph-clipboard-text text-lg text-slate-400"></i> ${t('notifReq')}</span>
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" ${state.prefs.notifyRequests ? 'checked' : ''} onchange="toggleNotif('notifyRequests')" class="sr-only peer">
                                        <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-brand-pink"></div>
                                    </label>
                                </div>` : ''}
                            </div>

                            <button onclick="logout()" class="w-full bg-red-50 dark:bg-red-500/10 text-red-500 p-4 rounded-2xl shadow-card flex items-center justify-center text-sm font-bold mt-4 hover:bg-red-100 dark:hover:bg-red-500/20 transition-colors">
                                ${t('logout')}
                            </button>
                        </div>
                        
                        <div class="w-full mt-6 space-y-3 px-2">
                            <h3 class="text-sm font-bold text-slate-800 dark:text-white mb-2">${t('financialHistory')}</h3>
                            ${myHist.length === 0 ? `<p class="text-center text-xs text-slate-400 py-4">${t('noTx')}</p>` : myHist.map(tx => `
                                <div class="bg-white dark:bg-slate-800 p-3 rounded-xl flex justify-between items-center shadow-sm border border-slate-50 dark:border-slate-700/50">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-full ${tx.type === 'deposit' ? 'bg-green-50 text-green-500' : 'bg-purple-50 text-purple-500'} flex items-center justify-center shrink-0">
                                            <i class="ph ${tx.type === 'deposit' ? 'ph-arrow-down-left' : 'ph-hand-coins'}"></i>
                                        </div>
                                        <div class="min-w-0">
                                            <p class="font-medium text-xs truncate">${tx.type === 'deposit' ? t('depositLabel') : t('refundLabel') + ' (' + (tx.description || '') + ')'}</p>
                                            <span class="inline-block mt-0.5 text-[9px] px-1.5 py-[2px] rounded-md font-medium ${tx.status==='approved'?'bg-green-100 text-green-600':tx.status==='rejected'?'bg-red-100 text-red-600':'bg-orange-100 text-orange-600'}">${tx.status==='approved'?t('statusApproved'):tx.status==='rejected'?t('statusRejected'):t('statusPending')}</span>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <div class="font-bold text-sm ${tx.type === 'deposit' ? 'text-green-500' : 'text-purple-600 dark:text-purple-400'}">
                                            ${tx.type === 'deposit' ? '+' : '+'}฿${Number(tx.amount).toLocaleString()}
                                        </div>
                                        ${(tx.status === 'pending' && tx.requestedBy === state.currentUser.uid) || state.currentUser.role === 'treasurer' ? `
                                            <button onclick="confirmDeleteTx('${tx.id}')" title="${t('deleteItem')}" class="w-7 h-7 rounded-full bg-red-50 text-red-500 hover:bg-red-100 dark:bg-red-500/10 dark:hover:bg-red-500/20 flex items-center justify-center transition-colors shrink-0">
                                                <i class="ph ph-trash text-xs"></i>
                                            </button>
                                        ` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : `
                        <form onsubmit="saveProfileEdit(event)" class="w-full mt-4 space-y-4 px-2">
                            <div>
                                <input type="file" id="edit_pic" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'edit_preview')">
                                <label for="edit_pic" class="block w-full py-4 border-2 border-dashed border-brand-pinkLight rounded-2xl text-center cursor-pointer bg-brand-pink/5 hover:bg-brand-pink/10 transition-colors">
                                    <div id="edit_preview" class="text-brand-pinkDark flex flex-col items-center">
                                        <i class="ph ph-camera text-2xl mb-1"></i>
                                        <span class="text-xs font-medium">${t('changePic')}</span>
                                    </div>
                                </label>
                            </div>
                            
                            <div>
                                <label class="text-xs text-slate-500 mb-1 ml-2 block font-medium">${t('studentId10')}</label>
                                <input type="text" id="edit_studentId" value="${state.currentUser.studentId}" pattern="\\d{10}" maxLength="10" required class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-900 rounded-2xl outline-none text-slate-800 dark:text-white border border-slate-100 dark:border-slate-800 focus:ring-2 focus:ring-brand-pinkLight text-sm font-mono">
                            </div>

                            <div>
                                <label class="text-xs text-slate-500 mb-1 ml-2 block font-medium">${t('firstName')}</label>
                                <input type="text" id="edit_name" value="${state.currentUser.name}" required class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-900 rounded-2xl outline-none text-slate-800 dark:text-white border border-slate-100 dark:border-slate-800 focus:ring-2 focus:ring-brand-pinkLight text-sm">
                            </div>
                            <div class="hidden">
                                <input type="text" id="edit_surname" value="${state.currentUser.surname || ''}">
                            </div>
                            <div>
                                <label class="text-xs text-slate-500 mb-1 ml-2 block font-medium">${t('nickname')}</label>
                                <input type="text" id="edit_nickname" value="${state.currentUser.nickname}" required class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-900 rounded-2xl outline-none text-slate-800 dark:text-white border border-slate-100 dark:border-slate-800 focus:ring-2 focus:ring-brand-pinkLight text-sm">
                            </div>
                            
                            <div class="flex gap-3 pt-4">
                                <button type="button" onclick="toggleEditProfile()" class="flex-1 py-3.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold hover:bg-slate-200 transition-colors border border-slate-200 dark:border-slate-600">${t('cancel')}</button>
                                <button type="submit" class="flex-1 py-3.5 rounded-full bg-brand-pink text-white font-bold hover:bg-brand-pinkDark transition-colors shadow-soft">${t('save')}</button>
                            </div>
                        </form>
                    `}
                </div>
            `;
        }
        
        window.addEventListener('DOMContentLoaded', initData);
    </script>
</body>
</html>
