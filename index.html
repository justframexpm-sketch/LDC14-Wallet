            prefs: { notifyTransactions: true, notifyRequests: true }
        };

        function getOrCreateDeviceId() {
            let devId = localStorage.getItem('ldc14_device_id');
            if (!devId) {
                devId = 'dev_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
                localStorage.setItem('ldc14_device_id', devId);
            }
            return devId;
        }

        // --- Preferences Manager ---
        function loadPrefs(uid) {
            if (!uid) return;
            const saved = localStorage.getItem('ldc14_prefs_' + uid);
            if (saved) {
                const parsed = JSON.parse(saved);
                state.lang = parsed.lang || 'th';
                state.theme = parsed.theme || 'dark';
                state.prefs = {
                    notifyTransactions: parsed.notifyTransactions !== false,
                    notifyRequests: parsed.notifyRequests !== false
                };
            } else {
                state.prefs = { notifyTransactions: true, notifyRequests: true };
            }
            document.documentElement.className = state.theme;
            updateThemeIcon();
            document.getElementById('langLabel').innerText = state.lang.toUpperCase();
        }

        function savePrefs() {
            if (!state.currentUser) return;
            localStorage.setItem('ldc14_prefs_' + state.currentUser.uid, JSON.stringify({
                lang: state.lang,
                theme: state.theme,
                ...state.prefs
            }));
        }

        async function initData() {
            state.deviceId = getOrCreateDeviceId();
            
            const savedSession = localStorage.getItem('ldc14_session');
            if (savedSession) {
                state.currentUser = JSON.parse(savedSession);
                loadPrefs(state.currentUser.uid);
            } else {
                document.documentElement.className = state.theme;
                updateThemeIcon();
            }

            await fetchCloudData();
            setupRealtimeSubscriptions();
        }

        // Fetch Data from Supabase Cloud
        async function fetchCloudData() {
            try {
                const { data: usersData, error: uError } = await supabaseClient.from('users').select('*');
                if (!uError && usersData) {
                    state.users = usersData.map(u => ({
                        uid: u.uid,
                        email: u.email,
                        studentId: u.student_id,
                        name: u.name,
                        surname: u.surname,
                        nickname: u.nickname,
                        photoUrl: u.photo_url,
                        boundDeviceId: u.bound_device_id,
                        role: u.role,
                        isSetup: u.is_setup
                    }));
                }

                const { data: txData, error: tError } = await supabaseClient
                    .from('transactions')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (!tError && txData) {
                    state.transactions = txData.map(t => ({
                        id: t.id,
                        type: t.type,
                        amount: t.amount,
                        description: t.description,
                        slipUrl: t.slip_url,
                        proofUrl: t.proof_url,
                        status: t.status,
                        requestedBy: t.requested_by,
                        targetUser: t.target_user,
                        issuedBy: t.issued_by,
                        createdAt: t.created_at
                    }));
                }

                if (state.currentUser) {
                    const match = state.users.find(u => u.uid === state.currentUser.uid);
                    if (match) state.currentUser = match;
                }

                render();
            } catch (err) {
                console.error("Supabase Sync Error:", err);
                render();
            }
        }

        // --- Notifications Manager ---
        function pushNotification(title, body) {
            if (Notification.permission === 'granted') {
                new Notification(title, { body });
            }
        }

        async function toggleNotif(key) {
            if (!state.prefs[key]) {
                const perm = await Notification.requestPermission();
                if (perm !== 'granted') {
                    showToast('โปรดอนุญาตการแจ้งเตือนในเบราว์เซอร์', 'error');
                    return;
                }
            }
            state.prefs[key] = !state.prefs[key];
            savePrefs();
            render();
        }

        function handleTransactionChange(payload) {
            if (!state.currentUser) return;
            
            const newTx = payload.new;
            const oldTx = payload.old;
            const eventType = payload.eventType;

            if (eventType === 'INSERT' && newTx.status === 'pending') {
                if (state.currentUser.role === 'treasurer' && state.prefs.notifyRequests) {
                    pushNotification('คำขอใหม่ LDC', `มีคำขอ${newTx.type === 'deposit' ? 'ฝากเงิน' : 'เบิกจ่าย'}ใหม่ ยอด ฿${newTx.amount}`);
                }
            }

            if (eventType === 'UPDATE' && newTx.status !== 'pending' && oldTx.status === 'pending') {
                if ((newTx.requested_by === state.currentUser.uid || newTx.target_user === state.currentUser.uid) && state.prefs.notifyTransactions) {
                    pushNotification(`LDC: รายการ${newTx.status === 'approved' ? 'อนุมัติ' : 'ถูกปฏิเสธ'}`, `คำขอ ฿${newTx.amount} ของคุณได้รับการอัปเดตแล้ว`);
                }
                if (state.currentUser.role === 'treasurer' && newTx.status === 'approved' && state.prefs.notifyTransactions) {
                    pushNotification(`LDC: เงินเข้า/ออกกองกลาง`, `รายการ ${newTx.type} ฿${newTx.amount} อนุมัติสำเร็จ`);
                }
            }
        }

        function setupRealtimeSubscriptions() {
            supabaseClient
                .channel('public:db_changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, () => fetchCloudData())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'transactions' }, (payload) => {
                    handleTransactionChange(payload);
                    fetchCloudData();
                })
                .subscribe();
        }

        function saveLocalSession() {
            if (state.currentUser) {
                localStorage.setItem('ldc14_session', JSON.stringify(state.currentUser));
            } else {
                localStorage.removeItem('ldc14_session');
            }
        }

        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.className = state.theme;
            updateThemeIcon();
            savePrefs();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            if (state.theme === 'dark') {
                icon.className = 'fa-solid fa-sun text-brand-gold';
            } else {
                icon.className = 'fa-solid fa-moon text-brand-pink';
            }
        }

        function toggleLang() {
            state.lang = state.lang === 'th' ? 'en' : 'th';
            document.getElementById('langLabel').innerText = state.lang.toUpperCase();
            savePrefs();
            render();
        }

        function toggleBalanceVisibility() {
            state.hideBalance = !state.hideBalance;
            render();
        }

        const t = (key) => dict[state.lang][key] || key;

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastContent = document.getElementById('toastContent');
            const toastIcon = document.getElementById('toastIcon');
            const toastMsg = document.getElementById('toastMsg');

            toastMsg.innerText = msg;
            if (type === 'error') {
                toastContent.className = "px-5 py-3 rounded-2xl shadow-2xl backdrop-blur-md border text-xs font-semibold flex items-center gap-2 bg-rose-500/20 border-rose-500/30 text-rose-600 dark:text-rose-300";
                toastIcon.className = "fa-solid fa-circle-xmark text-base";
            } else {
                toastContent.className = "px-5 py-3 rounded-2xl shadow-2xl backdrop-blur-md border text-xs font-semibold flex items-center gap-2 bg-emerald-500/20 border-emerald-500/30 text-emerald-600 dark:text-emerald-300";
                toastIcon.className = "fa-solid fa-circle-check text-base";
            }

            toast.classList.remove('translate-x-full', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
            }, 3000);
        }

        let confirmActionCallback = null;
        function showConfirmModal(title, msg, onConfirm, isDanger = true) {
            document.getElementById('confirmModalTitle').innerText = title;
            document.getElementById('confirmModalMsg').innerText = msg;
            
            const actionBtn = document.getElementById('confirmModalActionBtn');
            if (isDanger) {
                actionBtn.className = "flex-1 py-2.5 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-semibold text-xs shadow-md transition-all";
            } else {
                actionBtn.className = "flex-1 py-2.5 rounded-xl bg-gradient-to-r from-brand-pink to-brand-pinkLight text-white font-semibold text-xs shadow-md transition-all";
            }

            confirmActionCallback = onConfirm;
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.add('hidden');
            confirmActionCallback = null;
        }

        document.getElementById('confirmModalActionBtn').addEventListener('click', () => {
            if (confirmActionCallback) confirmActionCallback();
            closeConfirmModal();
        });

        // --- Transaction Deletion Logic ---
        function confirmDeleteTx(txId) {
            showConfirmModal('ยกเลิกคำขอ', 'คุณต้องการยกเลิกและลบคำขอนี้ใช่หรือไม่?', () => executeDeleteTx(txId), true);
        }

        async function executeDeleteTx(txId) {
            const { error } = await supabaseClient.from('transactions').delete().eq('id', txId);
            if (error) {
                showToast("ยกเลิกคำขอไม่สำเร็จ: " + error.message, "error");
            } else {
                showToast("ยกเลิกคำขอเรียบร้อยแล้ว", "success");
            }
        }

        let authMode = 'login';

        function setAuthMode(mode) {
            authMode = mode;
            state.enteredPin = '';
            render();
        }

        function handleKeypadPress(num) {
            if (num === 'backspace') {
                state.enteredPin = state.enteredPin.slice(0, -1);
            } else if (state.enteredPin.length < 10) {
                state.enteredPin += num;
            }
            updatePinDots();
        }

        function updatePinDots() {
            const container = document.getElementById('pinDotsContainer');
            if (!container) return;

            let html = '';
            for (let i = 0; i < 10; i++) {
                const filled = i < state.enteredPin.length;
                html += `
                    <div class="w-6 h-8 rounded-lg border flex items-center justify-center font-bold text-sm transition-all ${
                        filled 
                        ? 'border-brand-pink bg-gradient-to-tr from-brand-pink to-brand-pinkLight text-white shadow-md shadow-brand-pink/20 scale-105' 
                        : 'border-slate-300 dark:border-slate-700 bg-slate-100/50 dark:bg-slate-800/50 text-transparent'
                    }">
                        ${filled ? state.enteredPin[i] : '•'}
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function triggerBiometrics() {
            if (state.users.length > 0) {
                const targetUser = state.users[0];
                if (targetUser.boundDeviceId && targetUser.boundDeviceId !== state.deviceId) {
                    showToast(t('deviceBoundError'), 'error');
                    return;
                }
                showToast("สแกน Touch ID / Face ID สำเร็จ!", "success");
                state.currentUser = targetUser;
                saveLocalSession();
                loadPrefs(targetUser.uid);
                render();
            } else {
                showToast("ยังไม่มีผู้ใช้อยู่ในระบบ กรุณาลงทะเบียนก่อน", "error");
            }
        }

        async function handleBankAuth(e) {
            e.preventDefault();
            const emailInput = document.getElementById('authEmail').value.trim().toLowerCase();
            const pinInput = state.enteredPin;

            if (!emailInput.endsWith('@bumail.net') && !emailInput.endsWith('@bu.ac.th')) {
                showToast(t('requireBUEmail'), 'error');
                return;
            }

            if (pinInput.length !== 10) {
                showToast(t('require10Digits'), 'error');
                return;
            }

            const existingUser = state.users.find(u => u.email === emailInput || u.studentId === pinInput);

            if (authMode === 'login') {
                if (!existingUser) {
                    showToast(t('userNotFound'), 'error');
                    return;
                }
                if (existingUser.studentId !== pinInput) {
                    showToast("เลขประจำตัว 10 หลักไม่ถูกต้อง", "error");
                    return;
                }

                if (existingUser.boundDeviceId && existingUser.boundDeviceId !== state.deviceId) {
                    showToast(t('deviceBoundError'), 'error');
                    return;
                }

                if (!existingUser.boundDeviceId) {
                    existingUser.boundDeviceId = state.deviceId;
                    await supabaseClient.from('users').update({ bound_device_id: state.deviceId }).eq('uid', existingUser.uid);
                }

                state.currentUser = existingUser;
                saveLocalSession();
                loadPrefs(existingUser.uid);
                showToast(t('success'));
                render();
            } else {
                if (existingUser) {
                    showToast(t('emailExists'), 'error');
                    return;
                }

                state.currentUser = {
                    uid: 'user_' + Date.now(),
                    email: emailInput,
                    studentId: pinInput,
                    boundDeviceId: state.deviceId,
                    isSetup: false
                };
                saveLocalSession();
                loadPrefs(state.currentUser.uid);
                savePrefs();
                showToast(t('success'));
                render();
            }
        }

        function logout() {
            state.currentUser = null;
            state.activeTab = 'dashboard';
            state.enteredPin = '';
            saveLocalSession();
            showToast(t('success'));
            render();
        }

        function switchTab(tabId) {
            state.activeTab = tabId;
            render();
        }

        function updateNavState() {
            const logoutBtn = document.getElementById('logoutBtn');
            const bottomNav = document.getElementById('bottomNav');
            const navApprovals = document.getElementById('nav-approvals');
            const navAdmin = document.getElementById('nav-admin');

            if (!state.currentUser || !state.currentUser.isSetup) {
                bottomNav.classList.add('hidden');
                logoutBtn.classList.add('hidden');
                return;
            }

            bottomNav.classList.remove('hidden');
            logoutBtn.classList.remove('hidden');

            const isTreasurer = state.currentUser.role === 'treasurer';
            if (isTreasurer) {
                navApprovals.classList.remove('hidden');
                navApprovals.classList.add('flex');
                navAdmin.classList.remove('hidden');
                navAdmin.classList.add('flex');
            } else {
                navApprovals.classList.add('hidden');
                navApprovals.classList.remove('flex');
                navAdmin.classList.add('hidden');
                navAdmin.classList.remove('flex');
            }

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-gradient-to-r', 'from-brand-pink', 'to-brand-pinkLight', 'text-white', 'shadow-md');
                btn.classList.add('text-slate-400');
            });

            const activeBtn = document.getElementById(`nav-${state.activeTab}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-400');
                activeBtn.classList.add('bg-gradient-to-r', 'from-brand-pink', 'to-brand-pinkLight', 'text-white', 'shadow-md');
            }
        }

        let currentModalProof = null;
        function openProofModal(imgUrl, title, subtitle) {
            currentModalProof = imgUrl;
            document.getElementById('modalImg').src = imgUrl;
            document.getElementById('modalTitle').innerText = title || t('proofTitle');
            document.getElementById('modalSubtitle').innerText = subtitle || '';
            document.getElementById('proofModal').classList.remove('hidden');
        }

        function closeProofModal() {
            document.getElementById('proofModal').classList.add('hidden');
        }

        function downloadProof() {
            if (!currentModalProof) return;
            const link = document.createElement('a');
            link.href = currentModalProof;
            link.download = `ldc14-bank-slip-${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        let cropper = null;
        let cropTargetPreviewId = null;

        function handleImageUpload(event, previewId, isProfile = false) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onloadend = () => {
                if (isProfile) {
                    cropTargetPreviewId = previewId;
                    openCropModal(reader.result);
                    event.target.value = '';
                } else {
                    uploadedImageTemp = reader.result;
                    const container = document.getElementById(previewId);
                    if (container) {
                        container.innerHTML = `
                            <img src="${reader.result}" class="w-16 h-16 rounded-xl object-cover shadow-sm mx-auto" />
                            <span class="text-[10px] text-emerald-500 font-semibold mt-1 block">อัปโหลดสำเร็จ</span>
                        `;
                    }
                }
            };
            reader.readAsDataURL(file);
        }

        function openCropModal(imageSrc) {
            const modalImg = document.getElementById('cropModalImg');
            modalImg.src = imageSrc;
            document.getElementById('cropModal').classList.remove('hidden');

            if (cropper) cropper.destroy();

            cropper = new Cropper(modalImg, {
                aspectRatio: 1,
                viewMode: 1,
                autoCropArea: 0.9,
                responsive: true
            });
        }

        function closeCropModal() {
            document.getElementById('cropModal').classList.add('hidden');
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        }

        function applyCropImage() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({ width: 350, height: 350 });
            uploadedImageTemp = canvas.toDataURL('image/jpeg', 0.85);
            const container = document.getElementById(cropTargetPreviewId);
            if (container) {
                container.innerHTML = `
                    <img src="${uploadedImageTemp}" class="w-16 h-16 rounded-full object-cover shadow-md mx-auto border-2 border-brand-pink" />
                    <span class="text-[10px] text-emerald-500 font-semibold mt-1 block">ครอปรูปสำเร็จ</span>
                `;
            }
            closeCropModal();
        }

        function render() {
            const container = document.getElementById('mainContainer');
            updateNavState();

            if (!state.currentUser) {
                container.innerHTML = renderBankLoginScreen();
                updatePinDots();
                return;
            }

            if (!state.currentUser.isSetup) {
                container.innerHTML = renderOnboardingScreen();
                return;
            }

            switch (state.activeTab) {
                case 'dashboard':
                    container.innerHTML = renderDashboardView();
                    break;
                case 'expenses':
                    container.innerHTML = renderExpensesView();
                    break;
                case 'approvals':
                    container.innerHTML = renderApprovalsView();
                    break;
                case 'admin':
                    container.innerHTML = renderAdminView();
                    break;
                case 'profile':
                    container.innerHTML = renderProfileView();
                    break;
                default:
                    container.innerHTML = renderDashboardView();
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[state.lang][key]) el.innerText = dict[state.lang][key];
            });
        }

        async function saveProfileOnboarding(e) {
            e.preventDefault();
            const studentId = document.getElementById('onb_studentId').value;
            if (!/^\d{10}$/.test(studentId)) {
                showToast(t('require10Digits'), 'error');
                return;
            }

            const isFirst = state.users.length === 0;
            const newUser = {
                uid: state.currentUser.uid,
                email: state.currentUser.email,
                student_id: studentId,
                name: document.getElementById('onb_name').value,
                surname: document.getElementById('onb_surname').value,
                nickname: document.getElementById('onb_nickname').value,
                photo_url: uploadedImageTemp || '',
                bound_device_id: state.deviceId,
                role: isFirst ? 'treasurer' : 'member',
                is_setup: true
            };

            const { error } = await supabaseClient.from('users').insert([newUser]);
            if (error) {
                showToast("ไม่สามารถบันทึกโปรไฟล์ลง Cloud ได้: " + error.message, "error");
                return;
            }

            state.currentUser = {
                ...newUser,
                studentId: newUser.student_id,
                photoUrl: newUser.photo_url,
                boundDeviceId: newUser.bound_device_id,
                isSetup: true
            };

            uploadedImageTemp = '';
            saveLocalSession();
            await fetchCloudData();
            showToast(t('success'));
        }

        function uploadExpenseProof(event, txId) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onloadend = async () => {
                const { error } = await supabaseClient.from('transactions').update({ proof_url: reader.result }).eq('id', txId);
                if (!error) {
                    showToast(t('success'));
                } else {
                    showToast("อัปโหลดไม่สำเร็จ: " + error.message, "error");
                }
            };
            reader.readAsDataURL(file);
        }

        function confirmDeleteUser(uid) {
            const userToDelete = state.users.find(u => u.uid === uid);
            if (!userToDelete) return;

            showConfirmModal(
                `ยืนยันการลบสมาชิก`,
                `คุณต้องการลบคุณ ${userToDelete.name} (${userToDelete.nickname}) ออกจากระบบใช่หรือไม่?`,
                () => {
                    executeDeleteUser(uid);
                },
                true
            );
        }

        async function executeDeleteUser(uid) {
            const { error } = await supabaseClient.from('users').delete().eq('uid', uid);
            if (error) {
                showToast("ลบสมาชิกไม่สำเร็จ: " + error.message, "error");
                return;
            }

            if (state.currentUser && state.currentUser.uid === uid) {
                state.currentUser = null;
                saveLocalSession();
                showToast("บัญชีของคุณถูกลบออกจากระบบแล้ว", "error");
                render();
                return;
            }

            showToast(t('success'));
        }

        async function resetMemberDeviceBinding(uid) {
            const { error } = await supabaseClient.from('users').update({ bound_device_id: null }).eq('uid', uid);
            if (!error) {
                showToast(`ปลดล็อกเครื่องเรียบร้อยแล้ว`);
            } else {
                showToast("ปลดล็อกไม่สำเร็จ: " + error.message, "error");
            }

        function confirmResetSystem() {
            showConfirmModal(
                `รีเซ็ตระบบใหม่ทั้งหมด`,
                t('resetSystemConfirmMsg'),
                () => {
                    executeFactoryReset();
                },
                true
            );
        }

        async function executeFactoryReset() {
            await supabaseClient.from('transactions').delete().neq('id', 'keep_none');
            await supabaseClient.from('users').delete().neq('uid', 'keep_none');

            localStorage.clear();
            state.currentUser = null;
            state.enteredPin = '';
            state.deviceId = getOrCreateDeviceId();

            showToast("ล้างข้อมูลในระบบ Cloud สำเร็จทั้งหมดแล้ว", "success");
            render();
        }

        async function submitRefund(e) {
            e.preventDefault();
            const target = document.getElementById('ref_target').value;
            const amount = document.getElementById('ref_amount').value;

            if (!target || !amount || !uploadedImageTemp) {
                showToast("กรุณากรอกข้อมูลและอัปโหลดสลิปคืนเงินให้ครบถ้วน", "error");
                return;
            }

            const newTx = {
                id: 'tx_' + Date.now(),
                type: 'refund',
                amount: Number(amount),
                target_user: target,
                slip_url: uploadedImageTemp,
                status: 'approved',
                issued_by: state.currentUser.uid
            };

            const { error } = await supabaseClient.from('transactions').insert([newTx]);
            if (error) {
                showToast("บันทึกการคืนเงินไม่สำเร็จ: " + error.message, "error");
                return;
            }

            uploadedImageTemp = '';
            showToast(t('success'));
        }

                                                <span class="text-[9px] text-slate-400">${t(tx.status)}</span>
                                                ${slip ? `
                                                    <button onclick="openProofModal('${slip}', '${t(tx.type)} - ฿${Number(tx.amount).toLocaleString()}', 'สถานะ: ${t(tx.status)}')" class="text-[8px] px-1.5 py-0.5 rounded-md bg-blue-500/10 text-blue-500 font-semibold flex items-center gap-0.5">
                                                        <i class="fa-solid fa-eye text-[8px]"></i> ${t('viewProof')}
                                                    </button>
                                                ` : ''}
                                                ${tx.status === 'pending' && tx.requestedBy === state.currentUser.uid ? `
                                                    <button onclick="confirmDeleteTx('${tx.id}')" class="text-[8px] px-1.5 py-0.5 rounded-md bg-rose-500/10 text-rose-500 font-semibold flex items-center gap-0.5">
                                                        <i class="fa-solid fa-trash text-[8px]"></i> ${t('cancelRequest')}
                                                    </button>
                                                ` : ''}
                                            </div>
                                        </div>
                                    </div>
                                    <div class="font-bold text-xs font-mono ${tx.type === 'expense' ? 'text-rose-500' : 'text-emerald-500'}">
                                        ${tx.type === 'expense' ? '-' : '+'}฿${Number(tx.amount).toLocaleString()}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function toggleEditProfile() {
            isEditingProfile = !isEditingProfile;
            render();
        }

        async function saveProfileEdit(e) {
            e.preventDefault();
            const studentId = document.getElementById('edit_studentId').value;
            if (!/^\d{10}$/.test(studentId)) {
                showToast(t('require10Digits'), 'error');
                return;
            }

            const u = state.currentUser;
            const updatePayload = {
                name: document.getElementById('edit_name').value,
                surname: document.getElementById('edit_surname').value,
                nickname: document.getElementById('edit_nickname').value
            };
            if (uploadedImageTemp) updatePayload.photo_url = uploadedImageTemp;

            const { error } = await supabaseClient.from('users').update(updatePayload).eq('uid', u.uid);
            if (error) {
                showToast("แก้ไขโปรไฟล์ไม่สำเร็จ: " + error.message, "error");
                return;
            }

            uploadedImageTemp = '';
            isEditingProfile = false;
            saveLocalSession();
            showToast(t('success'));
        }

        window.addEventListener('DOMContentLoaded', initData);
    </script>
</body>
</html>
