<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LDC Wallet - The 14th Generation</title>
    
    <!-- Minimalist SVG Favicon (Cute Wallet) -->

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            pink: '#FF9EBB',
                            pinkLight: '#FFC2D1',
                            pinkDark: '#FB6F92',

                            bg: '#F8F9FA'
                        }
                    },
                    fontFamily: {
                        sans: ['"IBM Plex Sans Thai"', 'sans-serif']

                    boxShadow: {
                        'soft': '0 10px 30px -5px rgba(255, 158, 187, 0.2)',
                        'card': '0 4px 20px -2px rgba(0, 0, 0, 0.05)'
                    }
                }

        }
    </script>
    
    <!-- Google Fonts: IBM Plex Sans Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Cropper.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: 'IBM Plex Sans Thai', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #F8F9FA;
            user-select: none;
        }

        .dark body { background-color: #0F172A; }

        .app-container {
            width: 100%;
            margin: 0 auto;
            background: #FFFFFF;
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        @media (min-width: 768px) {
            .app-container {
                max-width: 48rem;
                min-height: 850px;
                border-radius: 2rem;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
                margin: 2.5rem auto;
                border: 1px solid rgba(0,0,0,0.05);
            }
        }

        @media (min-width: 1024px) {
            .app-container {
                max-width: 64rem;
            }
        }

        .dark .app-container {
            background: #1E293B;
            border-color: rgba(255,255,255,0.05);
        }

        .balance-card {
            background: linear-gradient(135deg, #FF9EBB 0%, #FB6F92 100%);
            position: relative;
            overflow: hidden;
        }
        
        .balance-card::after {
            content: '';
            position: absolute;
            bottom: -30px;
            right: -30px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: transform 0.1s ease;
        }
        .dark .glass-btn {
            background: rgba(40, 40, 40, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-btn:active { transform: scale(0.95); }

        .keypad-btn {
            font-size: 1.25rem;
            font-weight: 500;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            background: #F8F9FA;
            transition: all 0.15s;
        }
        .dark .keypad-btn { background: #334155; color: white; }
        .keypad-btn:active { background: #FFC2D1; color: #FB6F92; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .nav-active { color: #FB6F92 !important; font-weight: 600; }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-100 transition-colors duration-300 md:p-6 lg:p-10">

    <div id="app" class="app-container">
        <!-- Header -->
        <header id="topHeader" class="sticky top-0 z-40 px-6 py-4 bg-white/90 dark:bg-[#1E293B]/90 backdrop-blur flex items-center justify-between rounded-t-none md:rounded-t-[2rem]">

        <!-- Bottom Navigation -->
        <nav id="bottomNav" class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-[400px] z-40">
            <div class="bg-white dark:bg-slate-800 shadow-[0_10px_40px_rgba(0,0,0,0.1)] rounded-full px-4 py-3 flex justify-around items-center border border-slate-100 dark:border-slate-700">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center gap-1 text-slate-400 transition-colors w-16 hover:text-slate-600 dark:hover:text-slate-300">

                    <span class="text-[10px]">หน้าหลัก</span>

                <button onclick="switchTab('expenses')" id="nav-expenses" class="flex flex-col items-center gap-1 text-slate-400 transition-colors w-16 hover:text-slate-600 dark:hover:text-slate-300">
                    <i class="ph ph-receipt text-2xl"></i>
                    <span class="text-[10px]">เบิกจ่าย</span>
                </button>
                <button onclick="switchTab('approvals')" id="nav-approvals" class="hidden flex-col items-center gap-1 text-slate-400 transition-colors w-16 relative hover:text-slate-600 dark:hover:text-slate-300">
                    <i class="ph ph-check-circle text-2xl"></i>
                    <span class="text-[10px]">อนุมัติ</span>

                <button onclick="switchTab('admin')" id="nav-admin" class="hidden flex-col items-center gap-1 text-slate-400 transition-colors w-16 hover:text-slate-600 dark:hover:text-slate-300">
                    <i class="ph ph-users text-2xl"></i>
                    <span class="text-[10px]">จัดการ</span>

                <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-slate-400 transition-colors w-16 hover:text-slate-600 dark:hover:text-slate-300">

    <!-- Modals & Toasts -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 transform -translate-y-24 opacity-0 pointer-events-none">
        <div id="toastContent" class="px-6 py-3 rounded-full shadow-lg text-sm font-medium flex items-center gap-2 bg-slate-800 text-white border border-slate-700">
            <i id="toastIcon" class="ph ph-check-circle text-xl text-brand-pinkLight"></i>
            <span id="toastMsg">สำเร็จ</span>
        </div>
    </div>

    <div id="confirmModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/40 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl scale-100 transition-transform border border-slate-100 dark:border-slate-700">
            <div class="w-14 h-14 rounded-full bg-red-50 dark:bg-red-500/10 text-red-500 mx-auto flex items-center justify-center text-2xl mb-4">
                <i class="ph ph-warning"></i>
            </div>
            <h3 id="confirmModalTitle" class="font-bold text-lg mb-2">ยืนยัน</h3>
            <p id="confirmModalMsg" class="text-sm text-slate-500 dark:text-slate-400 mb-6 font-light">คุณแน่ใจหรือไม่?</p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 py-3 rounded-2xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors font-medium">ยกเลิก</button>
                <button id="confirmModalActionBtn" class="flex-1 py-3 rounded-2xl bg-red-500 hover:bg-red-600 transition-colors text-white font-medium shadow-md text-sm">ตกลง</button>

        </div>

    <div id="proofModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-4 w-full max-w-sm shadow-2xl flex flex-col gap-4 border border-slate-100 dark:border-slate-700">
            <div class="flex justify-between items-center px-2">
                <div>
                    <h3 id="modalTitle" class="font-bold">หลักฐาน</h3>
                    <p id="modalSubtitle" class="text-xs text-slate-500"></p>
                </div>
                <button onclick="closeProofModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 flex justify-center items-center hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors"><i class="ph ph-x"></i></button>
            </div>
            <div class="bg-slate-100 dark:bg-slate-900 rounded-2xl p-2 flex justify-center max-h-[60vh] overflow-hidden">
                <img id="modalImg" src="" class="object-contain w-full h-full rounded-xl" />
            </div>
            <button onclick="closeProofModal()" class="w-full py-3 rounded-2xl bg-brand-pink text-white font-medium hover:bg-brand-pinkDark transition-colors shadow-soft">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- Scan Modal -->
    <div id="scanModal" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center">
        <div class="bg-white dark:bg-slate-800 w-full rounded-3xl p-6 transition-transform max-w-[400px] border border-slate-100 dark:border-slate-700 mx-4 text-center">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">สแกนจ่าย / ฝากเงิน</h3>
                <button onclick="document.getElementById('scanModal').classList.add('hidden')" class="text-slate-400 p-1 hover:text-slate-600 transition-colors"><i class="ph ph-x text-xl"></i></button>
            </div>
            <div class="p-6 bg-slate-50 dark:bg-slate-900 rounded-2xl mb-4 border border-slate-100 dark:border-slate-800 flex flex-col items-center">
                <i class="ph ph-qr-code text-6xl text-brand-pinkDark mb-2"></i>
                <p class="text-xs text-slate-500 dark:text-slate-400">ใช้สแกน QR Code เพื่อทำรายการฝากเงินกองกลาง</p>
            </div>
            <button onclick="document.getElementById('scanModal').classList.add('hidden'); document.getElementById('actionModal').classList.remove('hidden');" class="w-full py-3.5 rounded-full bg-brand-pink text-white font-bold hover:bg-brand-pinkDark transition-colors shadow-soft">
                เปิด QR Code ฝากเงิน
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://jbwirerpdbjbtbuoxncz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_W74U6tBhgRDr50YPeNSeSw_EMvYAkLh";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let state = {
            theme: 'light',
            currentUser: null,
            users: [],
            transactions: [],
            activeTab: 'dashboard',
            hideBalance: false,
            enteredPin: '',
            deviceId: 'dev_' + Math.random().toString(36).substr(2, 9)
        };

        async function initData() {
            const savedSession = localStorage.getItem('ldc14_minimal_session');
            if (savedSession) state.currentUser = JSON.parse(savedSession);
            
            applyTheme();
            await fetchCloudData();
            
            supabaseClient
                .channel('public:db')
                .on('postgres_changes', { event: '*', schema: 'public' }, fetchCloudData)
                .subscribe();
        }

        async function fetchCloudData() {
            try {
                const { data: usersData } = await supabaseClient.from('users').select('*');
                if (usersData) {
                    state.users = usersData.map(u => ({
                        uid: u.uid, email: u.email, studentId: u.student_id, name: u.name,
                        surname: u.surname, nickname: u.nickname, photoUrl: u.photo_url, 
                        role: u.role, isSetup: u.is_setup
                    }));
                }

                const { data: txData } = await supabaseClient.from('transactions').select('*').order('created_at', { ascending: false });
                if (txData) {
                    state.transactions = txData.map(t => ({
                        id: t.id, type: t.type, amount: t.amount, description: t.description,
                        slipUrl: t.slip_url, proofUrl: t.proof_url, status: t.status,
                        requestedBy: t.requested_by, targetUser: t.target_user
                    }));
                }

                if (state.currentUser) {
                    const match = state.users.find(u => u.uid === state.currentUser.uid);
                    if (match) state.currentUser = match;
                }
                
                if (!state.currentUser || state.currentUser.isSetup) {
                    render();
                }
            } catch (err) { 
                console.error(err); 
                if (!state.currentUser || state.currentUser.isSetup) render(); 
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            
            if (isError) {
                document.getElementById('toastContent').classList.add('bg-red-50', 'text-red-600', 'border-red-100');
                document.getElementById('toastContent').classList.remove('bg-slate-800', 'text-white', 'border-slate-700');
                document.getElementById('toastIcon').className = 'ph ph-x-circle text-xl text-red-500';
            } else {
                document.getElementById('toastContent').classList.remove('bg-red-50', 'text-red-600', 'border-red-100');
                document.getElementById('toastContent').classList.add('bg-slate-800', 'text-white', 'border-slate-700');
                document.getElementById('toastIcon').className = 'ph ph-check-circle text-xl text-brand-pinkLight';
            }
            
            toast.classList.remove('-translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-24', 'opacity-0');
            }, 3000);
        }

        function toggleTheme() {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            applyTheme();
        }
        
        function applyTheme() {
            if (state.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'ph ph-sun text-lg';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = 'ph ph-moon text-lg';
            }
        }

        let authMode = 'login';
        function setAuthMode(mode) { authMode = mode; state.enteredPin = ''; render(); }
        
        function handleKeypadPress(num) {
            if (num === 'del') state.enteredPin = state.enteredPin.slice(0, -1);
            else if (state.enteredPin.length < 10) state.enteredPin += num;
            renderPinDots();
        }

        function renderPinDots() {
            const container = document.getElementById('pinDots');
            if(!container) return;
            let html = '';
            for (let i = 0; i < 10; i++) {
                const filled = i < state.enteredPin.length;
                html += `<div class="w-3 h-3 rounded-full mx-1 transition-all ${filled ? 'bg-brand-pink scale-110' : 'bg-slate-200 dark:bg-slate-700'}"></div>`;
            }
            container.innerHTML = html;
        }

        function submitAuth(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim().toLowerCase();
            const pin = state.enteredPin;
            if (pin.length !== 10) return showToast('กรุณากรอกรหัส 10 หลัก', true);

            if (authMode === 'login') {
                const user = state.users.find(u => u.email === email && u.studentId === pin);
                if (!user) return showToast('อีเมลหรือรหัส 10 หลักไม่ถูกต้อง', true);
                
                state.currentUser = user;
                localStorage.setItem('ldc14_minimal_session', JSON.stringify(user));
                showToast('เข้าสู่ระบบสำเร็จ');
                render();
            } else {
                const domain = email.split('@')[1];
                if (domain !== 'bu.ac.th' && domain !== 'bumail.net') {
                    return showToast('ใช้อีเมล @bu.ac.th หรือ @bumail.net เท่านั้น', true);
                }
                
                const existingByEmail = state.users.find(u => u.email === email);
                if (existingByEmail) return showToast('อีเมลนี้ลงทะเบียนแล้ว', true);
                
                const existingByPin = state.users.filter(u => u.studentId === pin);
                if (existingByPin.length >= 2) return showToast('รหัสนักศึกษานี้ลงทะเบียนครบ 2 บัญชีแล้ว', true);
                
                const sameDomain = existingByPin.find(u => u.email.endsWith('@' + domain));
                if (sameDomain) return showToast(`โดเมน @${domain} ถูกใช้สำหรับรหัสนี้ไปแล้ว`, true);

                state.currentUser = { uid: 'user_' + Date.now(), email, studentId: pin, isSetup: false };
                render();
            }
        }

        async function saveOnboarding(e) {
            e.preventDefault();
            const name = document.getElementById('ob_name').value;
            const nickname = document.getElementById('ob_nickname').value;
            const submitBtn = document.getElementById('ob_submit_btn');
            
            submitBtn.innerHTML = '<i class="ph ph-spinner-gap animate-spin text-xl"></i> กำลังบันทึก...';
            submitBtn.disabled = true;
            
            const newUser = {
                uid: state.currentUser.uid,
                email: state.currentUser.email,
                student_id: state.currentUser.studentId,
                name: name,
                surname: 'ไม่ระบุ',
                nickname: nickname,
                photo_url: uploadedImageTemp || '',
                role: state.users.length === 0 ? 'treasurer' : 'member',
                is_setup: true
            };

            const { error } = await supabaseClient.from('users').insert([newUser]);
            
            if (error) {
                submitBtn.innerHTML = 'บันทึกข้อมูล';
                submitBtn.disabled = false;
                return showToast('เกิดข้อผิดพลาด: ' + error.message, true);
            }

            state.currentUser = {
                uid: newUser.uid,
                email: newUser.email,
                studentId: newUser.student_id,
                name: newUser.name,
                surname: newUser.surname,
                nickname: newUser.nickname,
                photoUrl: newUser.photo_url,
                role: newUser.role,
                isSetup: true
            };
            
            state.users.push(state.currentUser);
            localStorage.setItem('ldc14_minimal_session', JSON.stringify(state.currentUser));
            
            uploadedImageTemp = '';
            state.activeTab = 'dashboard';
            
            render();
            showToast('สร้างโปรไฟล์สำเร็จ');
            fetchCloudData(); 
        }

        function logout() {
            state.currentUser = null; state.enteredPin = '';
            localStorage.removeItem('ldc14_minimal_session');
            render();
        }

        function switchTab(tab) { state.activeTab = tab; render(); }

        let uploadedImageTemp = '';
        function handleImageUpload(event, previewId) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onloadend = () => {
                uploadedImageTemp = reader.result;
                const el = document.getElementById(previewId);
                if(el) el.innerHTML = `<img src="${reader.result}" class="w-full h-full object-cover rounded-xl" />`;
            };
            reader.readAsDataURL(file);
        }

        function closeConfirmModal() { 
            document.getElementById('confirmModal').classList.add('hidden'); 
        }
        
        function closeProofModal() { 
            document.getElementById('proofModal').classList.add('hidden'); 
        }
        
        let currentProofUrl = '';
        function openProofModal(url, title, subtitle) {
            currentProofUrl = url;
            document.getElementById('modalImg').src = url;
            document.getElementById('modalTitle').innerText = title || 'หลักฐาน';
            document.getElementById('modalSubtitle').innerText = subtitle || '';
            document.getElementById('proofModal').classList.remove('hidden');
        }

        function render() {
            const container = document.getElementById('mainContainer');
            const nav = document.getElementById('bottomNav');
            const logoutBtn = document.getElementById('logoutBtn');

            if (!state.currentUser) {
                nav.classList.add('hidden'); logoutBtn.classList.add('hidden');
                container.innerHTML = renderAuth();
                renderPinDots();
                return;
            }

            if (!state.currentUser.isSetup) {
                nav.classList.add('hidden'); logoutBtn.classList.add('hidden');
                container.innerHTML = renderOnboarding();
                return;
            }

            nav.classList.remove('hidden'); logoutBtn.classList.remove('hidden');
            
            document.querySelectorAll('#bottomNav button').forEach(b => {
                b.classList.remove('nav-active');
                b.querySelector('i').classList.remove('weight-fill');
            });
            const activeBtn = document.getElementById(`nav-${state.activeTab}`);
            if(activeBtn) {
                activeBtn.classList.add('nav-active');
                activeBtn.querySelector('i').classList.add('weight-fill');
            }

            if (state.currentUser.role === 'treasurer') {
                document.getElementById('nav-approvals').classList.remove('hidden');
                document.getElementById('nav-approvals').classList.add('flex');

        async function submitDeposit(e) {
            e.preventDefault();
            const amt = document.getElementById('dep_amt').value;
            if(!amt || !uploadedImageTemp) return showToast('กรุณากรอกข้อมูลและแนบรูปสลิปให้ครบถ้วน', true);
            
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerHTML = '<i class="ph ph-spinner-gap animate-spin"></i> กำลังส่ง...';
            btn.disabled = true;

            const { error } = await supabaseClient.from('transactions').insert([{ 
                id: 'tx_'+Date.now(), 
                type: 'deposit', 
                amount: amt, 
                slip_url: uploadedImageTemp, 
                status: 'pending', 
                requested_by: state.currentUser.uid 
            }]);
            
            btn.innerHTML = originalText;
            btn.disabled = false;

            if(error) return showToast(error.message, true);
            
            document.getElementById('actionModal').classList.add('hidden');
            uploadedImageTemp = ''; 
            showToast('ส่งรายการสำเร็จ รอการตรวจสอบ');
        }

        async function submitTreasurerRefund(e) {
            e.preventDefault();
            if (state.currentUser.role !== 'treasurer') {
                return showToast('เฉพาะเหรัญญิกเท่านั้นที่สามารถทำรายการคืนเงินได้', true);
            }

            const targetUid = document.getElementById('ref_target_user').value;
            const reason = document.getElementById('ref_reason').value;
            const amt = document.getElementById('ref_amt').value;
            
            if (!targetUid || !reason || !amt) {
                return showToast('กรุณากรอกข้อมูลให้ครบถ้วน', true);
            }

            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerHTML = '<i class="ph ph-spinner-gap animate-spin"></i> กำลังบันทึก...';
            btn.disabled = true;

            const { error } = await supabaseClient.from('transactions').insert([{ 
                id: 'tx_'+Date.now(), 
                type: 'refund', 
                amount: amt,
                description: reason,
                status: 'approved',
                requested_by: state.currentUser.uid,
                target_user: targetUid,
                slip_url: uploadedImageTemp || ''
            }]);
            
            btn.innerHTML = originalText;
            btn.disabled = false;

            if(error) return showToast(error.message, true);
            
            document.getElementById('refundModal').classList.add('hidden');
            uploadedImageTemp = '';
            showToast('ทำรายการคืนเงินสำเร็จ');
        }

        async function saveProfileEdit(e) {
            e.preventDefault();

            if (!/^\d{10}$/.test(newStudentId)) {
                return showToast('กรุณากรอกรหัสนักศึกษา 10 หลัก', true);
            }

            btn.innerHTML = '<i class="ph ph-spinner-gap animate-spin"></i> กำลังบันทึก...';
            btn.disabled = true;

            const updatePayload = {
                name: document.getElementById('edit_name').value,
                nickname: document.getElementById('edit_nickname').value,
                surname: document.getElementById('edit_surname').value || 'ไม่ระบุ',
                student_id: newStudentId
            };
            if (uploadedImageTemp) updatePayload.photo_url = uploadedImageTemp;

            const { error } = await supabaseClient.from('users').update(updatePayload).eq('uid', state.currentUser.uid);
            
            btn.innerHTML = 'บันทึก';
            btn.disabled = false;
            
            if (error) return showToast("แก้ไขโปรไฟล์ไม่สำเร็จ: " + error.message, true);

            uploadedImageTemp = '';
            isEditingProfile = false;
            
            state.currentUser.name = updatePayload.name;
            state.currentUser.nickname = updatePayload.nickname;
            state.currentUser.surname = updatePayload.surname;
            state.currentUser.studentId = updatePayload.student_id;
            if (updatePayload.photo_url) state.currentUser.photoUrl = updatePayload.photo_url;
            
            localStorage.setItem('ldc14_minimal_session', JSON.stringify(state.currentUser));
            showToast('บันทึกโปรไฟล์สำเร็จ');
            render();
        }
        
        async function toggleNotif(key) {
            if(!state.prefs) state.prefs = { notifyTransactions: true, notifyRequests: true };
            state.prefs[key] = !state.prefs[key];
            if(state.prefs[key] && Notification.permission === 'default') {
                await Notification.requestPermission();
            }
            showToast('อัปเดตการตั้งค่าแจ้งเตือนแล้ว');
            render();
        }

        async function submitExpenseClaim(e) {
            e.preventDefault();
            const reason = document.getElementById('exp_reason').value;
            const amount = document.getElementById('exp_amount').value;
            
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerHTML = '<i class="ph ph-spinner-gap animate-spin"></i> กำลังส่ง...';
            btn.disabled = true;

            const { error } = await supabaseClient.from('transactions').insert([{
                id: 'tx_' + Date.now(),
                type: 'expense',
                amount: amount,
                description: reason,
                status: 'pending',
                requested_by: state.currentUser.uid
            }]);

            btn.innerHTML = originalText;
            btn.disabled = false;
            
            if (error) return showToast(error.message, true);
            document.getElementById('expenseModal').classList.add('hidden');
            showToast('ยื่นขอเบิกจ่ายสำเร็จ');
        }

        function uploadExpenseProof(event, txId) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onloadend = async () => {
                const { error } = await supabaseClient.from('transactions').update({ proof_url: reader.result }).eq('id', txId);
                if (error) showToast("อัปโหลดไม่สำเร็จ", true);
                else showToast('อัปโหลดใบเสร็จสำเร็จ');
            };
            reader.readAsDataURL(file);
        }
        
        function confirmDeleteTx(txId) {
            document.getElementById('confirmModalTitle').innerText = 'ลบรายการ';
            document.getElementById('confirmModalMsg').innerText = 'คุณต้องการลบรายการนี้ใช่หรือไม่? (การกระทำนี้จะลบรายการออกจากระบบถาวร)';
            const actionBtn = document.getElementById('confirmModalActionBtn');
            actionBtn.onclick = async () => {
                closeConfirmModal();
                const { error } = await supabaseClient.from('transactions').delete().eq('id', txId);
                if(error) showToast("เกิดข้อผิดพลาดในการลบ: " + error.message, true);
                else showToast("ลบรายการแล้ว");
            };
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        async function updateTxStatus(txId, status) {
            const { error } = await supabaseClient.from('transactions').update({ status }).eq('id', txId);
            if (error) showToast("อัปเดตไม่สำเร็จ", true);
            else showToast('ทำรายการสำเร็จ');
        }

                                        </div>
                                        <div class="min-w-0">
                                            <p class="font-medium text-xs truncate">${tx.type === 'deposit' ? 'โอนเงินเข้ากองกลาง' : 'ได้รับเงินคืน (' + (tx.description || '') + ')'}</p>
                                            <span class="inline-block mt-0.5 text-[9px] px-1.5 py-[2px] rounded-md font-medium ${tx.status==='approved'?'bg-green-100 text-green-600':tx.status==='rejected'?'bg-red-100 text-red-600':'bg-orange-100 text-orange-600'}">${tx.status==='approved'?'สำเร็จ':tx.status==='rejected'?'ถูกปฎิเสธ':'รอตรวจสอบ'}</span>
                                        </div>
                                    </div>
                                    <div class="font-bold text-sm ${tx.type === 'deposit' ? 'text-green-500' : 'text-purple-600 dark:text-purple-400'}">
                                        ${tx.type === 'deposit' ? '+' : '+'}฿${Number(tx.amount).toLocaleString()}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : `
                        <form onsubmit="saveProfileEdit(event)" class="w-full mt-4 space-y-4 px-2">
                            <div>
                                <input type="file" id="edit_pic" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'edit_preview')">
                                <label for="edit_pic" class="block w-full py-4 border-2 border-dashed border-brand-pinkLight rounded-2xl text-center cursor-pointer bg-brand-pink/5 hover:bg-brand-pink/10 transition-colors">
                                    <div id="edit_preview" class="text-brand-pinkDark flex flex-col items-center">
                                        <i class="ph ph-camera text-2xl mb-1"></i>
                                        <span class="text-xs font-medium">เปลี่ยนรูปโปรไฟล์</span>
                                    </div>
                                </label>
                            </div>
                            
                            <div>
                                <label class="text-xs text-slate-500 mb-1 ml-2 block font-medium">รหัสนักศึกษา (10 หลัก)</label>
                                <input type="text" id="edit_studentId" value="${state.currentUser.studentId}" pattern="\\d{10}" maxLength="10" required class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-900 rounded-2xl outline-none text-slate-800 dark:text-white border border-slate-100 dark:border-slate-800 focus:ring-2 focus:ring-brand-pinkLight text-sm font-mono">
                            </div>

                            <div>
                                <label class="text-xs text-slate-500 mb-1 ml-2 block font-medium">ชื่อจริง</label>
                                <input type="text" id="edit_name" value="${state.currentUser.name}" required class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-900 rounded-2xl outline-none text-slate-800 dark:text-white border border-slate-100 dark:border-slate-800 focus:ring-2 focus:ring-brand-pinkLight text-sm">
                            </div>
                            <div class="hidden">
                                <input type="text" id="edit_surname" value="${state.currentUser.surname || ''}">
                            </div>
                            <div>
                                <label class="text-xs text-slate-500 mb-1 ml-2 block font-medium">ชื่อเล่น</label>
                                <input type="text" id="edit_nickname" value="${state.currentUser.nickname}" required class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-900 rounded-2xl outline-none text-slate-800 dark:text-white border border-slate-100 dark:border-slate-800 focus:ring-2 focus:ring-brand-pinkLight text-sm">
                            </div>
                            
                            <div class="flex gap-3 pt-4">
                                <button type="button" onclick="toggleEditProfile()" class="flex-1 py-3.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold hover:bg-slate-200 transition-colors border border-slate-200 dark:border-slate-600">ยกเลิก</button>
                                <button type="submit" class="flex-1 py-3.5 rounded-full bg-brand-pink text-white font-bold hover:bg-brand-pinkDark transition-colors shadow-soft">บันทึก</button>
                            </div>
                        </form>
                    `}
                </div>
            `;
        }
        
        window.addEventListener('DOMContentLoaded', initData);
    </script>
</body>
</html>
